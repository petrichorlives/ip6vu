<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carrozzeria Audio Visualizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #0b0b0b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Double-DIN Head Unit Chassis (1334x750 layout styling) */
        .head-unit {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 4px solid #262626;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: row;
            position: relative;
        }
        /* Left / Right Hardware Controls (Knobs & Buttons) */
        .side-panel {
            width: 90px;
            background: linear-gradient(90deg, #141414, #222);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-right: 2px solid #000;
        }
        .side-panel.right {
            border-right: none;
            border-left: 2px solid #000;
        }
        .knob {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #333 0%, #111 80%);
            border: 2px solid #444;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            position: relative;
        }
        .knob::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 23px;
            width: 4px;
            height: 12px;
            background: #ff5500;
            border-radius: 2px;
        }
        .hw-button {
            width: 60px;
            height: 25px;
            background: #1c1c1c;
            border: 1px solid #333;
            color: #777;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
            border-radius: 3px;
        }
        /* Main Screen Area */
        .screen-container {
            flex: 1;
            background-color: #020502;
            border: 4px inset #0f140f;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,255,100,0.05);
        }
        /* VFD Status Bar */
        .vfd-header {
            height: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            color: #ffb000;
            font-family: monospace;
            font-size: 14px;
            text-shadow: 0 0 6px rgba(255,176,0,0.6);
            border-bottom: 1px solid #0d1a0d;
        }
        .brand-logo {
            font-weight: 900;
            letter-spacing: 2px;
            font-style: italic;
            color: #ff5500;
            text-shadow: 0 0 8px rgba(255,85,0,0.8);
        }
        /* Visualizer Canvas Area */
        .visualizer-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* Tap to start overlay */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffb000;
            z-index: 10;
            cursor: pointer;
            text-align: center;
            font-family: monospace;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ff5500;
            text-shadow: 0 0 10px rgba(255,85,0,0.8);
        }
        #overlay p {
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="head-unit">
        <!-- Left Deck Hardware Panel -->
        <div class="side-panel">
            <div class="knob" title="Volume"></div>
            <div class="hw-button">SRC</div>
            <div class="hw-button">ATT</div>
            <div class="hw-button">EQ</div>
        </div>

        <!-- Center Double-DIN VFD Screen -->
        <div class="screen-container">
            <div id="overlay">
                <h1>CARROZZERIA AUDIO DSP</h1>
                <p>TAP ANYWHERE TO INITIALIZE MIC</p>
            </div>
            
            <div class="vfd-header">
                <div class="brand-logo">PIONEER DEH</div>
                <div id="status-text">12-BAND SPECTRUM</div>
                <div id="clock">12:00</div>
            </div>

            <div class="visualizer-area">
                <canvas id="visCanvas"></canvas>
            </div>
        </div>

        <!-- Right Deck Hardware Panel -->
        <div class="side-panel right">
            <div class="knob" title="Tuning/Audio"></div>
            <div class="hw-button">BAND</div>
            <div class="hw-button">DISP</div>
            <div class="hw-button">AUDIO</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('visCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const clockEl = document.getElementById('clock');

        // Update real-time clock simulation
        setInterval(() => {
            const now = new Date();
            clockEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        let audioCtx, analyser, microphone, dataArray;
        let isInitialized = false;

        overlay.addEventListener('click', async () => {
            if (isInitialized) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                analyser = audioCtx.createAnalyser();
                microphone = audioCtx.createMediaStreamSource(stream);
                
                analyser.fftSize = 64; // Small FFT size makes grouping into 12 bands efficient
                microphone.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                isInitialized = true;
                overlay.style.display = 'none';
                
                resizeCanvas();
                animate();
            } catch (err) {
                alert('Microphone access is required for the visualizer to function.');
                console.error(err);
            }
        });

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function animate() {
            requestAnimationFrame(animate);
            if (!isInitialized) return;

            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const totalBars = 12; // Exactly 12 frequency ranges requested
            const barWidth = (canvas.width / totalBars) - 6;
            let x = 4;

            for (let i = 0; i < totalBars; i++) {
                // Grab specific frequency indices scaled to 12 bins
                const dataIndex = Math.floor(i * (dataArray.length / totalBars));
                let value = dataArray[dataIndex];
                
                // Scale value to canvas height
                const barHeight = (value / 255) * (canvas.height - 20);

                // VFD Amber/Green Segment look
                const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
                gradient.addColorStop(0, '#ff5500');   // Bottom Amber
                gradient.addColorStop(0.6, '#ffb000'); // Mid Yellow
                gradient.addColorStop(1, '#00ffcc');   // Peak Cyan/Green

                ctx.fillStyle = gradient;
                
                // Draw segmented block look (retro EQ style)
                const segmentHeight = 4;
                const gap = 2;
                let currentY = canvas.height - 10;
                
                while (currentY > canvas.height - 10 - barHeight) {
                    ctx.fillRect(x, currentY, barWidth, segmentHeight);
                    currentY -= (segmentHeight + gap);
                }

                // Peak indicator dot
                if (barHeight > 5) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x, currentY - segmentHeight, barWidth, 2);
                }

                x += barWidth + 6;
            }
        }
    </script>
</body>
</html>

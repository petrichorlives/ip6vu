<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voyager Audio Works</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #050406;
            font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hardware Enclosure Chassis Frame */
        .vfd-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, #151316 0%, #0c0b0e 85%, #050406 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            gap: 8px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
        }

        /* Industrial Chassis Screws */
        .chassis-screw {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a3237 0%, #151214 90%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .chassis-screw::after {
            content: "";
            position: absolute;
            top: 3px; left: 1px; width: 6px; height: 1px;
            background: rgba(0,0,0,0.8);
        }
        .screw-tl { top: 6px; left: 6px; }
        .screw-tr { top: 6px; right: 6px; }
        .screw-bl { bottom: 6px; left: 6px; }
        .screw-br { bottom: 6px; right: 6px; }

        /* Scanline Overlay */
        .vfd-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.45) 50%),
                radial-gradient(circle, rgba(238, 134, 149, 0.02) 1px, transparent 1px);
            background-size: 100% 3px, 4px 4px;
            z-index: 6;
            pointer-events: none;
            opacity: 0.85;
        }

        /* Top Faceplate Header Frame */
        .vfd-header {
            height: 34px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            z-index: 4;
        }

        /* Recessed Modular Bays */
        .faceplate-bay {
            background: #080709;
            border: 1px solid rgba(119, 58, 77, 0.25);
            border-top-color: rgba(0, 0, 0, 0.85);
            border-left-color: rgba(0, 0, 0, 0.85);
            border-radius: 3px;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            padding: 0 10px;
        }

        .name-bay {
            height: 100%;
            flex: 0 1 auto;
            gap: 8px;
        }

        .status-led {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ee8695;
            box-shadow: 0 0 6px #ee8695;
        }

        .device-name {
            font-size: 9px;
            letter-spacing: 2px;
            color: rgba(238, 134, 149, 0.65);
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Vent Grille Module in Header */
        .header-vent-bay {
            height: 100%;
            flex: 1 1 auto;
            max-width: 140px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 0 8px;
            background: #060507;
        }

        .vent-slat {
            width: 2px;
            height: 16px;
            background: rgba(0, 0, 0, 0.9);
            border-right: 1px solid rgba(119, 58, 77, 0.3);
            box-shadow: inset 1px 0 1px rgba(0,0,0,0.9);
        }

        .clock-bay {
            height: 100%;
            flex: 0 0 auto;
        }

        .time-display {
            font-size: 9px;
            letter-spacing: 1.5px;
            color: rgba(207, 120, 98, 0.55);
            font-family: monospace;
        }

        /* Visualizer Main Bay Frame */
        .vis-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            z-index: 2;
            overflow: hidden;
            padding: 4px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Frequency Channel Markings Legend */
        .freq-legend {
            position: absolute;
            bottom: 2px;
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 6.5px;
            color: rgba(119, 58, 77, 0.6);
            pointer-events: none;
            z-index: 3;
            letter-spacing: 0.5px;
        }

        /* Startup Overlay */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #080709;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            cursor: pointer;
            padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        }

        .center-branding {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 480px;
        }

        /* Voyager Audio Works Custom Logo Container */
        .broadcast-logo-container {
            width: 90%;
            max-width: 420px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 22px rgba(238, 134, 149, 0.5));
        }

        .broadcast-logo-container svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .brand-copyright {
            font-size: 8.5px;
            letter-spacing: 3px;
            color: rgba(207, 120, 98, 0.65);
            font-family: monospace;
            margin-top: 8px;
        }

        .start-prompt {
            margin-top: 24px;
            font-size: 9px;
            letter-spacing: 2.5px;
            color: rgba(238, 134, 149, 0.65);
            text-transform: uppercase;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.95; }
        }

        /* Bottom Status Readout Bar */
        .status-bar-container {
            width: 100%;
            background: rgba(12, 10, 13, 0.95);
            border: 1px solid rgba(119, 58, 77, 0.3);
            border-radius: 4px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.9), 0 2px 12px rgba(0,0,0,0.6);
        }

        .status-readouts {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 8.5px;
            letter-spacing: 1.5px;
            color: rgba(207, 120, 98, 0.85);
            text-transform: uppercase;
        }

        .status-readouts span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-indicator {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ee8695;
            box-shadow: 0 0 6px #ee8695;
        }

        /* Progress Bar */
        .boot-progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(45, 26, 38, 0.7);
            border: 1px solid rgba(119, 58, 77, 0.25);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .boot-progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #543246 0%, #773a4d 40%, #cf7862 75%, #ee8695 100%);
            box-shadow: 0 0 10px rgba(238, 134, 149, 0.8);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="vfd-container">
        <!-- Hardware Screws -->
        <div class="chassis-screw screw-tl"></div>
        <div class="chassis-screw screw-tr"></div>
        <div class="chassis-screw screw-bl"></div>
        <div class="chassis-screw screw-br"></div>

        <!-- Startup Screen Overlay -->
        <div id="overlay">
            <div class="center-branding">
                
                <!-- Voyager Audio Works Custom Logo Visual -->
                <div class="broadcast-logo-container">
                    <svg viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="voyagerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#ee8695" />
                                <stop offset="100%" stop-color="#cf7862" />
                            </linearGradient>
                        </defs>

                        <g stroke="url(#voyagerGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <!-- Top Arc Curve -->
                            <path d="M 60 45 Q 200 -10 340 45" stroke-width="12" />

                            <!-- Outer/Inner Central Chevron-V Mark -->
                            <path d="M 65 48 L 200 180 L 335 48" stroke-width="12" />
                            <path d="M 105 48 L 200 148 L 295 48" stroke-width="8" />

                            <!-- Double Horizontal Crossbars -->
                            <line x1="125" y1="130" x2="275" y2="130" stroke-width="10" />
                            <line x1="85" y1="172" x2="315" y2="172" stroke-width="10" />

                            <!-- Lower Arc Bowl Curve -->
                            <path d="M 92 180 Q 200 240 308 180" stroke-width="12" />

                            <!-- Bottom Horizontal Speed Lines (7 Stripes) -->
                            <g stroke-width="5" opacity="0.95">
                                <line x1="100" y1="210" x2="220" y2="210" />
                                <line x1="100" y1="222" x2="220" y2="222" />
                                <line x1="100" y1="234" x2="220" y2="234" />
                                <line x1="100" y1="246" x2="220" y2="246" />
                                <line x1="100" y1="258" x2="220" y2="258" />
                                <line x1="100" y1="270" x2="220" y2="270" />
                                <line x1="100" y1="282" x2="220" y2="282" />
                            </g>
                        </g>

                        <!-- Right Stacked Typography Block -->
                        <g fill="url(#voyagerGrad)" font-family="sans-serif" font-weight="900">
                            <text x="242" y="228" font-size="21" letter-spacing="2">VOYAGER</text>
                            <text x="242" y="255" font-size="20" letter-spacing="3.5">AUDIO</text>
                            <text x="242" y="282" font-size="19" letter-spacing="2.5">WORKS</text>
                        </g>
                    </svg>
                </div>

                <div class="brand-copyright">VOYAGER AUDIO WORKS // MODEL VAW-80</div>
                <div class="start-prompt" id="start-prompt">[ tap screen to initialize ]</div>
            </div>

            <!-- Bottom Status Readout Bar -->
            <div class="status-bar-container">
                <div class="status-readouts">
                    <span><i class="status-indicator"></i><span id="sys-status">SYS_OFF</span></span>
                    <span id="status-line">READY TO INITIALIZE</span>
                    <span id="pct-display">00%</span>
                </div>
                <div class="boot-progress-bar">
                    <div class="boot-progress-fill" id="progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- Visualizer Header Frame -->
        <div class="vfd-header">
            <div class="faceplate-bay name-bay">
                <div class="status-led"></div>
                <div class="device-name">Voyager Audio Works</div>
            </div>
            
            <!-- Vent Grille Module -->
            <div class="faceplate-bay header-vent-bay">
                <div class="vent-slat"></div>
                <div class="vent-slat"></div>
                <div class="vent-slat"></div>
                <div class="vent-slat"></div>
                <div class="vent-slat"></div>
                <div class="vent-slat"></div>
                <div class="vent-slat"></div>
                <div class="vent-slat"></div>
            </div>

            <div class="faceplate-bay clock-bay">
                <div class="time-display" id="time-display">00:00:00</div>
            </div>
        </div>

        <!-- Visualizer Canvas Bay -->
        <div class="vis-container faceplate-bay">
            <canvas id="visCanvas"></canvas>
            <div class="freq-legend">
                <span>30Hz</span><span>80</span><span>180</span><span>320</span><span>600</span><span>1k</span><span>1.8k</span><span>2.8k</span><span>4.2k</span><span>6k</span><span>8.5k</span><span>16kHz</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('visCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startPrompt = document.getElementById('start-prompt');
        const sysStatus = document.getElementById('sys-status');
        const statusLine = document.getElementById('status-line');
        const pctDisplay = document.getElementById('pct-display');
        const progressFill = document.getElementById('progress-fill');
        const timeEl = document.getElementById('time-display');

        setInterval(() => {
            const now = new Date();
            timeEl.textContent = now.toTimeString().split(' ')[0];
        }, 1000);

        let audioCtx, analyser, microphone, dataArray;
        let isInitialized = false;
        let isBooting = false;

        const BARS_COUNT = 12;
        let currentHeights = new Array(BARS_COUNT).fill(0);
        let peakHeights = new Array(BARS_COUNT).fill(0);
        let peakHoldTimers = new Array(BARS_COUNT).fill(0);

        const FREQ_BOUNDS = [
            [30, 80], [80, 180], [180, 320], [320, 600],
            [600, 1000], [1000, 1800], [1800, 2800], [2800, 4200],
            [4200, 6000], [6000, 8500], [8500, 12000], [12000, 16000]
        ];

        overlay.addEventListener('click', async () => {
            if (isInitialized || isBooting) return;
            isBooting = true;

            startPrompt.style.display = 'none';
            sysStatus.textContent = "SYS_BOOT";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        autoGainControl: false,
                        noiseSuppression: false
                    }, 
                    video: false 
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                microphone = audioCtx.createMediaStreamSource(stream);
                
                analyser.fftSize = 512; 
                analyser.smoothingTimeConstant = 0.08; 
                microphone.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                const bootSteps = [
                    { pct: 20, text: "BUS_INITIALIZING" },
                    { pct: 45, text: "CALIBRATING_DSP" },
                    { pct: 75, text: "ANALOG_LOCK_OK" },
                    { pct: 100, text: "SYSTEM_ONLINE" }
                ];

                let currentStep = 0;
                let progress = 0;

                const bootInterval = setInterval(() => {
                    progress += 1;
                    progressFill.style.width = `${progress}%`;
                    pctDisplay.textContent = `${String(progress).padStart(2, '0')}%`;

                    if (currentStep < bootSteps.length && progress >= bootSteps[currentStep].pct) {
                        statusLine.textContent = bootSteps[currentStep].text;
                        currentStep++;
                    }

                    if (progress >= 100) {
                        clearInterval(bootInterval);
                        setTimeout(finishInitialization, 300);
                    }
                }, 35);

            } catch (err) {
                alert('Microphone access is required to run the visualizer.');
                console.error(err);
                isBooting = false;
                startPrompt.style.display = 'block';
                sysStatus.textContent = "SYS_OFF";
                statusLine.textContent = "READY TO INITIALIZE";
            }
        });

        function finishInitialization() {
            isInitialized = true;
            overlay.style.display = 'none';
            resizeCanvas();
            animate();
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function animate() {
            requestAnimationFrame(animate);
            if (!isInitialized) return;

            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const paddingX = 8;
            const availableWidth = canvas.width - (paddingX * 2);
            
            const barGap = Math.max(2, Math.floor(availableWidth * 0.015 * 0.65));
            const barWidth = Math.floor((availableWidth - (barGap * (BARS_COUNT - 1))) / BARS_COUNT);
            let x = paddingX;

            const maxHeight = canvas.height - 18;
            const nyquist = audioCtx.sampleRate / 2;

            const blockHeight = 4;
            const blockGap = 2.3; 
            const maxSegments = Math.floor(maxHeight / (blockHeight + blockGap));

            for (let i = 0; i < BARS_COUNT; i++) {
                const [lowHz, highHz] = FREQ_BOUNDS[i];
                const lowIndex = Math.floor((lowHz / nyquist) * dataArray.length);
                const highIndex = Math.min(
                    Math.ceil((highHz / nyquist) * dataArray.length), 
                    dataArray.length - 1
                );

                let sum = 0;
                let count = 0;
                for (let j = lowIndex; j <= highIndex; j++) {
                    sum += dataArray[j];
                    count++;
                }
                const rawValue = count > 0 ? sum / count : 0;
                const highBoost = 1 + (i * 0.08);
                const targetHeight = (Math.min(255, rawValue * highBoost) / 255) * maxHeight;

                if (targetHeight > currentHeights[i]) {
                    currentHeights[i] = targetHeight; 
                } else {
                    currentHeights[i] -= 4.2; 
                    if (currentHeights[i] < 0) currentHeights[i] = 0;
                }

                if (currentHeights[i] > peakHeights[i]) {
                    peakHeights[i] = currentHeights[i];
                    peakHoldTimers[i] = 8;
                } else {
                    if (peakHoldTimers[i] > 0) {
                        peakHoldTimers[i]--;
                    } else {
                        peakHeights[i] -= 1.4;
                        if (peakHeights[i] < 0) peakHeights[i] = 0;
                    }
                }

                const activeSegments = Math.floor(currentHeights[i] / (blockHeight + blockGap));

                // 1. Unlit Ghost Segments
                ctx.fillStyle = 'rgba(84, 50, 70, 0.16)';
                for (let seg = 0; seg < maxSegments; seg++) {
                    const segY = canvas.height - 14 - (seg * (blockHeight + blockGap));
                    ctx.fillRect(x, segY, barWidth, blockHeight);
                }

                // 2. Active Illuminated VFD Segments
                for (let seg = 0; seg < activeSegments; seg++) {
                    const segY = canvas.height - 14 - (seg * (blockHeight + blockGap));
                    const ratio = seg / maxSegments;

                    if (ratio < 0.35) {
                        ctx.fillStyle = '#543246'; 
                        ctx.shadowColor = 'rgba(84, 50, 70, 0.3)';
                    } else if (ratio < 0.60) {
                        ctx.fillStyle = '#773a4d'; 
                        ctx.shadowColor = 'rgba(119, 58, 77, 0.4)';
                    } else if (ratio < 0.80) {
                        ctx.fillStyle = '#a75252'; 
                        ctx.shadowColor = 'rgba(167, 82, 82, 0.45)';
                    } else if (ratio < 0.92) {
                        ctx.fillStyle = '#cf7862'; 
                        ctx.shadowColor = 'rgba(207, 120, 98, 0.5)';
                    } else {
                        ctx.fillStyle = '#ee8695'; 
                        ctx.shadowColor = 'rgba(238, 134, 149, 0.6)';
                    }

                    ctx.shadowBlur = 3;
                    ctx.fillRect(x, segY, barWidth, blockHeight);
                }

                // 3. Floating Peak Cap
                if (peakHeights[i] > 2) {
                    const peakY = canvas.height - 14 - peakHeights[i];
                    ctx.fillStyle = '#ee8695';
                    ctx.shadowColor = '#ee8695';
                    ctx.shadowBlur = 4;
                    ctx.fillRect(x, peakY, barWidth, 2);
                }

                x += barWidth + barGap;
            }

            ctx.shadowBlur = 0;
        }
    </script>
</body>
</html>

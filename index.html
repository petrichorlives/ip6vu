<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>aethelgard lx-12</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #080708;
            font-family: -apple-system, "SF Pro Text", "Consolas", monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Enclosure Chassis Frame */
        .vfd-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, #161416 0%, #0d0c0e 85%, #070607 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            gap: 10px;
            padding-top: max(14px, env(safe-area-inset-top));
            padding-bottom: max(14px, env(safe-area-inset-bottom));
            padding-left: max(14px, env(safe-area-inset-left));
            padding-right: max(14px, env(safe-area-inset-right));
        }

        /* Scanline Overlay Across All Bays */
        .vfd-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.45) 50%),
                radial-gradient(circle, rgba(238, 134, 149, 0.02) 1px, transparent 1px);
            background-size: 100% 3px, 4px 4px;
            z-index: 6;
            pointer-events: none;
            opacity: 0.85;
        }

        /* Top Faceplate Modular Header Frame */
        .vfd-header {
            height: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            z-index: 4;
        }

        /* Recessed Modular Bays (Name Bay, Clock Bay, Visualizer Bay) */
        .faceplate-bay {
            background: #09080a;
            border: 1px solid rgba(119, 58, 77, 0.22);
            border-top-color: rgba(0, 0, 0, 0.8);
            border-left-color: rgba(0, 0, 0, 0.8);
            border-radius: 3px;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            padding: 0 10px;
        }

        .name-bay {
            height: 100%;
            flex: 0 1 auto;
        }

        .clock-bay {
            height: 100%;
            flex: 0 0 auto;
        }

        .device-name {
            font-size: 9px;
            letter-spacing: 2px;
            color: rgba(238, 134, 149, 0.55);
            font-weight: 400;
            text-transform: lowercase;
        }

        .time-display {
            font-size: 9px;
            letter-spacing: 1.5px;
            color: rgba(207, 120, 98, 0.45);
            font-family: monospace;
        }

        /* Visualizer Main Bay Frame */
        .vis-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2;
            overflow: hidden;
            padding: 4px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Overlay */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 12, 14, 0.96);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgba(238, 134, 149, 0.6);
            z-index: 20;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 6px;
            color: rgba(238, 134, 149, 0.7);
            text-transform: lowercase;
        }
        #overlay p {
            font-size: 8px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }

        .boot-seq {
            display: none;
            font-family: monospace;
            font-size: 8px;
            color: rgba(207, 120, 98, 0.6);
            text-align: left;
            width: 200px;
            margin-top: 15px;
            line-height: 1.6;
        }
        .progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(119, 58, 77, 0.3);
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #cf7862;
            transition: width 0.08s linear;
        }
    </style>
</head>
<body>

    <div class="vfd-container">
        <!-- Initializer Overlay -->
        <div id="overlay">
            <div id="start-prompt">
                <h1>aethelgard lx-12</h1>
                <p>[ tap to initialize ]</p>
            </div>
            
            <div class="boot-seq" id="boot-seq">
                <div id="status-line">&gt; awaiting mic approval...</div>
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            </div>
        </div>

        <!-- Header with Segmented Faceplate Bays -->
        <div class="vfd-header">
            <div class="faceplate-bay name-bay">
                <div class="device-name">aethelgard lx-12</div>
            </div>
            <div class="faceplate-bay clock-bay">
                <div class="time-display" id="time-display">00:00:00</div>
            </div>
        </div>

        <!-- Visualizer Faceplate Bay -->
        <div class="vis-container faceplate-bay">
            <canvas id="visCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('visCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startPrompt = document.getElementById('start-prompt');
        const bootSeq = document.getElementById('boot-seq');
        const statusLine = document.getElementById('status-line');
        const progressFill = document.getElementById('progress-fill');
        const timeEl = document.getElementById('time-display');

        setInterval(() => {
            const now = new Date();
            timeEl.textContent = now.toTimeString().split(' ')[0];
        }, 1000);

        let audioCtx, analyser, microphone, dataArray;
        let isInitialized = false;
        let isBooting = false;

        const BARS_COUNT = 12;
        let currentHeights = new Array(BARS_COUNT).fill(0);
        let peakHeights = new Array(BARS_COUNT).fill(0);
        let peakHoldTimers = new Array(BARS_COUNT).fill(0);

        const FREQ_BOUNDS = [
            [30, 80], [80, 180], [180, 320], [320, 600],
            [600, 1000], [1000, 1800], [1800, 2800], [2800, 4200],
            [4200, 6000], [6000, 8500], [8500, 12000], [12000, 16000]
        ];

        overlay.addEventListener('click', async () => {
            if (isInitialized || isBooting) return;
            isBooting = true;

            startPrompt.style.display = 'none';
            bootSeq.style.display = 'block';

            try {
                // Request access first so the permission dialog appears clean
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        autoGainControl: false,
                        noiseSuppression: false
                    }, 
                    video: false 
                });

                // Once granted, trigger the smooth boot animation
                statusLine.textContent = "> initializing audio dsp...";
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                microphone = audioCtx.createMediaStreamSource(stream);
                
                analyser.fftSize = 512; 
                analyser.smoothingTimeConstant = 0.2; 
                microphone.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                let progress = 0;
                const bootInterval = setInterval(() => {
                    progress += 6;
                    progressFill.style.width = `${progress}%`;
                    if (progress >= 100) {
                        clearInterval(bootInterval);
                        finishInitialization();
                    }
                }, 25);

            } catch (err) {
                alert('Microphone access is required to run the visualizer.');
                console.error(err);
                isBooting = false;
                startPrompt.style.display = 'block';
                bootSeq.style.display = 'none';
            }
        });

        function finishInitialization() {
            isInitialized = true;
            overlay.style.display = 'none';
            resizeCanvas();
            animate();
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function animate() {
            requestAnimationFrame(animate);
            if (!isInitialized) return;

            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const paddingX = 8;
            const availableWidth = canvas.width - (paddingX * 2);
            const barGap = Math.max(3, Math.floor(availableWidth * 0.018));
            const barWidth = Math.floor((availableWidth - (barGap * (BARS_COUNT - 1))) / BARS_COUNT);
            let x = paddingX;

            const maxHeight = canvas.height - 8;
            const nyquist = audioCtx.sampleRate / 2;

            const blockHeight = 4;
            const blockGap = 2;
            const maxSegments = Math.floor(maxHeight / (blockHeight + blockGap));

            for (let i = 0; i < BARS_COUNT; i++) {
                const [lowHz, highHz] = FREQ_BOUNDS[i];
                const lowIndex = Math.floor((lowHz / nyquist) * dataArray.length);
                const highIndex = Math.min(
                    Math.ceil((highHz / nyquist) * dataArray.length), 
                    dataArray.length - 1
                );

                let sum = 0;
                let count = 0;
                for (let j = lowIndex; j <= highIndex; j++) {
                    sum += dataArray[j];
                    count++;
                }
                const rawValue = count > 0 ? sum / count : 0;
                const highBoost = 1 + (i * 0.08);
                const targetHeight = (Math.min(255, rawValue * highBoost) / 255) * maxHeight;

                // Physics (Soft Drop)
                if (targetHeight > currentHeights[i]) {
                    currentHeights[i] = targetHeight;
                } else {
                    currentHeights[i] -= 2.0;
                    if (currentHeights[i] < 0) currentHeights[i] = 0;
                }

                if (currentHeights[i] > peakHeights[i]) {
                    peakHeights[i] = currentHeights[i];
                    peakHoldTimers[i] = 12;
                } else {
                    if (peakHoldTimers[i] > 0) {
                        peakHoldTimers[i]--;
                    } else {
                        peakHeights[i] -= 0.8;
                        if (peakHeights[i] < 0) peakHeights[i] = 0;
                    }
                }

                const activeSegments = Math.floor(currentHeights[i] / (blockHeight + blockGap));

                // 1. Unlit Ghost Segments
                ctx.fillStyle = 'rgba(84, 50, 70, 0.18)';
                for (let seg = 0; seg < maxSegments; seg++) {
                    const segY = canvas.height - 4 - (seg * (blockHeight + blockGap));
                    ctx.fillRect(x, segY, barWidth, blockHeight);
                }

                // 2. Active Illuminated VFD Segments
                for (let seg = 0; seg < activeSegments; seg++) {
                    const segY = canvas.height - 4 - (seg * (blockHeight + blockGap));
                    const ratio = seg / maxSegments;

                    if (ratio < 0.35) {
                        ctx.fillStyle = '#543246'; 
                        ctx.shadowColor = 'rgba(84, 50, 70, 0.3)';
                    } else if (ratio < 0.60) {
                        ctx.fillStyle = '#773a4d'; 
                        ctx.shadowColor = 'rgba(119, 58, 77, 0.4)';
                    } else if (ratio < 0.80) {
                        ctx.fillStyle = '#a75252'; 
                        ctx.shadowColor = 'rgba(167, 82, 82, 0.45)';
                    } else if (ratio < 0.92) {
                        ctx.fillStyle = '#cf7862'; 
                        ctx.shadowColor = 'rgba(207, 120, 98, 0.5)';
                    } else {
                        ctx.fillStyle = '#ee8695'; 
                        ctx.shadowColor = 'rgba(238, 134, 149, 0.6)';
                    }

                    ctx.shadowBlur = 3;
                    ctx.fillRect(x, segY, barWidth, blockHeight);
                }

                // 3. Floating Peak Cap
                if (peakHeights[i] > 2) {
                    const peakY = canvas.height - 4 - peakHeights[i];
                    ctx.fillStyle = '#ee8695';
                    ctx.shadowColor = '#ee8695';
                    ctx.shadowBlur = 4;
                    ctx.fillRect(x, peakY, barWidth, 2);
                }

                x += barWidth + barGap;
            }

            ctx.shadowBlur = 0;
        }
    </script>
</body>
</html>

<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body,html{width:100vw;height:100vh;height:100dvh;background:#050611;font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;overflow:hidden;display:flex;justify-content:center;align-items:center}

padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.chassis-screw{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#3a3237 0%,#151214 90%);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 2px rgba(0,0,0,.8);z-index:30}

<body>

      <span>30Hz</span><span>60</span><span>120</span><span>250</span><span>500</span><span>1k</span><span>2k</span><span>4k</span><span>8k</span><span>16kHz</span>

<script>
const $ = id => document.getElementById(id);
const canvas = $('visCanvas'), ctx = canvas.getContext('2d');
const bootCanvas = $('bootCanvas'), bctx = bootCanvas.getContext('2d');
const gaugeCanvas = $('gaugeCanvas'), gctx = gaugeCanvas.getContext('2d');
const overlay = $('overlay'), chassis = $('chassis'), logoFrame = $('logoFrame');

setInterval(() => { $('time-display').textContent = new Date().toTimeString().split(' ')[0]; }, 1000);

const BARS = 24;
// Logarithmic bands preserve useful low-frequency detail while spreading the highs.
const FREQ_BOUNDS = Array.from({length:BARS}, (_, i) => {
  const minHz = 30, maxHz = 16000;
  const lo = minHz * Math.pow(maxHz / minHz, i / BARS);
  const hi = minHz * Math.pow(maxHz / minHz, (i + 1) / BARS);
  return [lo, hi];
});
const COLORS = ['#34304f','#51416d','#72527f','#94617f','#bd7188','#d59a9b'];
const BLOCK_H = 3, BLOCK_GAP = 1.7, STEP = BLOCK_H + BLOCK_GAP;

let audioCtx, analyser, dataArray, waveformArray, binRanges;
let isInitialized = false, isBooting = false, micReady = false, bootRAF = 0, micStream = null;

const heights = new Float32Array(BARS), peaks = new Float32Array(BARS), peakTimers = new Float32Array(BARS), prevTarget = new Float32Array(BARS);

/* ---------- canvas helpers (retina-aware) ---------- */
function setupCanvas(c, cx) {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  c._w = c.clientWidth; c._h = c.clientHeight;
  c.width = Math.round(c._w * dpr); c.height = Math.round(c._h * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function resizeAll() { setupCanvas(canvas, ctx); setupCanvas(bootCanvas, bctx); setupCanvas(gaugeCanvas, gctx); }
window.addEventListener('resize', resizeAll);

/* Shared renderer.
   Boot mode intentionally draws only the lamp-test spectrum. The live-only
   oscillator and bass meter are enabled after the boot sequence completes. */
function drawBars(c, cx, hts, pks, waveform = null, bassLevel = 0, live = false) {
  const w = c._w, h = c._h;
  cx.clearRect(0, 0, w, h);

  const bg = cx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#0d1020');
  bg.addColorStop(.55, '#0b0b18');
  bg.addColorStop(1, '#050711');
  cx.fillStyle = bg;
  cx.fillRect(0, 0, w, h);

  const padX = 8;
  const avail = w - padX * 2;

  if (live && waveform) {
    // Single-line time-domain oscillator.
    const oscTop = 7;
    const oscH = Math.max(28, h * .19);
    const midY = oscTop + oscH / 2;
    const amp = oscH * .43;

    cx.strokeStyle = 'rgba(111,139,176,.15)';
    cx.lineWidth = 1;
    cx.beginPath();
    cx.moveTo(padX, midY);
    cx.lineTo(w - padX, midY);
    cx.stroke();

    cx.strokeStyle = 'rgba(112,132,172,.12)';
    cx.setLineDash([2, 5]);
    cx.beginPath();
    cx.moveTo(padX, oscTop);
    cx.lineTo(w - padX, oscTop);
    cx.moveTo(padX, oscTop + oscH);
    cx.lineTo(w - padX, oscTop + oscH);
    cx.stroke();
    cx.setLineDash([]);

    cx.beginPath();
    const sampleStep = Math.max(1, Math.floor(waveform.length / Math.max(1, avail)));
    let first = true;
    for (let i = 0; i < waveform.length; i += sampleStep) {
      const x = padX + (i / (waveform.length - 1)) * avail;
      const y = midY + ((waveform[i] - 128) / 128) * amp;
      if (first) { cx.moveTo(x, y); first = false; }
      else cx.lineTo(x, y);
    }
    cx.lineJoin = 'round';
    cx.lineCap = 'round';
    cx.strokeStyle = 'rgba(103,202,216,.16)';
    cx.lineWidth = 4;
    cx.stroke();
    cx.strokeStyle = '#9bcbd5';
    cx.lineWidth = 1.15;
    cx.stroke();

    cx.font = '6px monospace';
    cx.fillStyle = 'rgba(160,180,202,.55)';
    cx.textAlign = 'left';
    cx.fillText('SIGNAL / TIME DOMAIN', padX + 2, oscTop + 7);

    // Horizontal low-frequency / bass energy meter.
    const bassY = oscTop + oscH + 8;
    const bassH = 5;
    const bassW = avail;
    cx.fillStyle = 'rgba(77,75,111,.32)';
    cx.fillRect(padX, bassY, bassW, bassH);
    cx.strokeStyle = 'rgba(120,136,177,.24)';
    cx.strokeRect(padX + .5, bassY + .5, bassW - 1, bassH - 1);

    const level = clamp(bassLevel);
    const fillW = Math.max(0, bassW * level);
    const bassGrad = cx.createLinearGradient(padX, 0, padX + bassW, 0);
    bassGrad.addColorStop(0, '#59618b');
    bassGrad.addColorStop(.58, '#7d829f');
    bassGrad.addColorStop(1, '#d69ab5');
    cx.fillStyle = bassGrad;
    cx.fillRect(padX + 1, bassY + 1, Math.max(0, fillW - 2), bassH - 2);

    cx.font = '6px monospace';
    cx.fillStyle = 'rgba(160,180,202,.58)';
    cx.textAlign = 'left';
    cx.fillText('LOW / BASS', padX, bassY + 14);
    cx.textAlign = 'right';
    cx.fillText('SUB ENERGY', w - padX, bassY + 14);
  }

  // Spectrum remains the primary lower display. During boot, it expands to
  // use the full short lamp-test canvas; live mode reserves room above.
  const top = live && waveform ? Math.max(oscH + 39, h * .40) : 4;
  const baseY = h - (live ? 17 : 5);
  const maxH = Math.max(8, baseY - top);
  const gap = Math.max(1, Math.floor(avail * .006));
  const bw = Math.max(1.5, (avail - gap * (BARS - 1)) / BARS);
  const maxSeg = Math.max(1, Math.floor(maxH / STEP));

  const ghost = new Path2D();
  const paths = COLORS.map(() => new Path2D());
  const glow = new Path2D(), caps = new Path2D();
  let x = padX;

  for (let i = 0; i < BARS; i++) {
    for (let s = 0; s < maxSeg; s++) {
      ghost.rect(x, baseY - s * STEP, bw, BLOCK_H);
    }
    const active = Math.min(maxSeg, Math.floor(hts[i] / STEP));
    for (let s = 0; s < active; s++) {
      const r = s / maxSeg;
      const ci = r < .25 ? 0 : r < .43 ? 1 : r < .60 ? 2 : r < .75 ? 3 : r < .89 ? 4 : 5;
      paths[ci].rect(x, baseY - s * STEP, bw, BLOCK_H);
    }
    if (active > 0) {
      const ty = baseY - (active - 1) * STEP;
      glow.rect(x - 1, ty - 2, bw + 2, BLOCK_H + 4);
    }
    if (pks[i] > 2) {
      caps.rect(x, baseY - Math.min(maxH, pks[i]), bw, 1.5);
    }
    x += bw + gap;
  }

  cx.fillStyle = 'rgba(74,74,112,.17)';
  cx.fill(ghost);
  cx.fillStyle = 'rgba(103,185,205,.10)';
  cx.fill(glow);
  COLORS.forEach((col, i) => {
    cx.fillStyle = col;
    cx.fill(paths[i]);
  });
  cx.fillStyle = '#d6a2bd';
  cx.fill(caps);

  if (live) {
    cx.fillStyle = 'rgba(132,148,183,.38)';
    cx.fillRect(padX, baseY + 3, avail, 1);
  }
}

/* ---------- boot sequence: night-noir VIP sedan welcome (7s) ---------- */
const DUR = 7000;
const LOG = [
  [300,  'VAW-80 FIRMWARE 2.4',    'OK'],
  [1100, 'MIC BUS HANDSHAKE',      'LOCK'],
  [1900, 'ANALOG STAGE WARM-UP',   'OK'],
  [2800, 'CABIN ACOUSTIC PROFILE', 'FLAT'],
  [3800, '2048-PT FFT / 24 BAND',  'OK'],
  [4800, 'VFD SEGMENT TEST',       'RUN'],
  [5900, 'ALL SYSTEMS',            'NOMINAL']
];
const STAGES = [[0,'COLD_START'],[15,'WARMING_TUBES'],[30,'GAUGE_SELF_CHECK'],[55,'SIGNAL_PATH_OK'],[78,'SEGMENT_TEST'],[93,'ALL_SYSTEMS_GO'],[100,'SYSTEM_ONLINE']];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = x => x * x * (3 - 2 * x);

// Optitron-style gauge: ticks weld on one by one, needle sweeps to redline, then settles
function drawGauge(t) {
  const w = gaugeCanvas._w, h = gaugeCanvas._h, g = gctx;
  g.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h - 8, R = Math.min(h - 14, w * 0.36), N = 31;
  const lit = clamp((t - 900) / 1100) * N;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '7px monospace';
  for (let i = 0; i < N; i++) {
    const f = i / (N - 1), a = Math.PI + f * Math.PI, major = i % 5 === 0;
    const col = f > .85 ? '#d99ab9' : f > .7 ? '#83b7c7' : '#a8c5d1';
    const on = i < lit;
    const cos = Math.cos(a), sin = Math.sin(a), r1 = R - (major ? 11 : 6);
    g.strokeStyle = on ? col : 'rgba(119,58,77,.22)';
    g.lineWidth = major ? 2 : 1;
    g.shadowColor = col; g.shadowBlur = on ? 6 : 0;
    g.beginPath(); g.moveTo(cx + cos * r1, cy + sin * r1); g.lineTo(cx + cos * R, cy + sin * R); g.stroke();
    if (major && on) { g.shadowBlur = 0; g.fillStyle = 'rgba(232,200,154,.7)'; g.fillText(i / 5, cx + cos * (R - 20), cy + sin * (R - 20)); }
  }
  if (t > 800) {
    let v;
    if (t < 2000) v = 0;
    else if (t < 3300) v = 1 - Math.pow(1 - (t - 2000) / 1300, 3);
    else if (t < 4400) v = 1 - 0.86 * smooth((t - 3300) / 1100);
    else v = 0.14 + 0.012 * Math.sin(t * 0.012);
    const a = Math.PI + v * Math.PI, cos = Math.cos(a), sin = Math.sin(a);
    g.strokeStyle = '#d99ab9'; g.shadowColor = '#d99ab9'; g.shadowBlur = 8; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx + cos * 8, cy + sin * 8); g.lineTo(cx + cos * (R - 3), cy + sin * (R - 3)); g.stroke();
    g.fillStyle = '#a8c5d1'; g.shadowColor = '#a8c5d1'; g.beginPath(); g.arc(cx, cy, 3, 0, 7); g.fill();
  }
  g.shadowBlur = 0;
}

function bootFrame(t0) {
  return function loop(now) {
    const t = now - t0;
    bootRAF = requestAnimationFrame(loop);

    // logo: power-cycle dip, then slow fade up and a breathing champagne glow
    logoFrame.style.opacity = t < 300 ? 1 - 0.95 * (t / 300) : 0.05 + 0.95 * smooth(clamp((t - 300) / 1500));
    const br = 0.5 + 0.5 * Math.sin(t * 0.004);
    logoFrame.style.filter = `drop-shadow(0 0 ${12 + 14 * br}px rgba(232,200,154,${0.12 + 0.14 * br}))`;

    // headlight

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRT Audio Spectrum Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #030303;
            font-family: "Courier New", Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRT Container simulating the tube screen */
        .crt-screen {
            width: 100vw;
            height: 100vh;
            background-color: #050b05; /* Deep phosphor green-black tint */
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            /* Curved CRT corner vignette */
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
        }

        /* Scanline Overlay Effect */
        .crt-screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            z-index: 5;
            pointer-events: none;
        }

        /* Screen Flicker Simulation */
        .crt-screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: rgba(18, 255, 128, 0.02);
            opacity: 0.8;
            z-index: 5;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.027; }
            50% { opacity: 0.015; }
            100% { opacity: 0.025; }
        }

        /* Top HUD Readout */
        .crt-header {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: #33ff66;
            font-size: 13px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(51, 255, 102, 0.7);
            border-bottom: 1px dashed rgba(51, 255, 102, 0.3);
            z-index: 2;
        }

        /* Visualizer Area */
        .visualizer-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 10px 20px 25px 20px;
            z-index: 2;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Bottom Status Line */
        .crt-footer {
            height: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: #22aa44;
            font-size: 11px;
            letter-spacing: 1px;
            border-top: 1px dashed rgba(51, 255, 102, 0.2);
            z-index: 2;
        }

        /* Initialization Overlay */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 5, 2, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #33ff66;
            z-index: 10;
            cursor: pointer;
            text-align: center;
            padding: 20px;
            text-shadow: 0 0 10px rgba(51, 255, 102, 0.8);
        }
        #overlay h1 {
            font-size: 16px;
            margin-bottom: 12px;
            letter-spacing: 3px;
        }
        #overlay p {
            font-size: 11px;
            color: #22aa44;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="crt-screen">
        <!-- Interactive Start Overlay -->
        <div id="overlay">
            <h1>SYS.MONITOR // 12-CH ANALYZER</h1>
            <p>&gt; CLICK TO INITIALIZE AUDIO STREAM &lt;</p>
        </div>

        <!-- Terminal Header -->
        <div class="crt-header">
            <span>CH: 12-BAND FFT</span>
            <span id="system-time">TIME: --:--:--</span>
            <span>MODE: CRT-FLAT</span>
        </div>

        <!-- Main Visualizer Canvas -->
        <div class="visualizer-area">
            <canvas id="visCanvas"></canvas>
        </div>

        <!-- Terminal Footer -->
        <div class="crt-footer">
            <span>STATUS: ACTIVE</span>
            <span>INPUT: MIC_ARRAY</span>
            <span>GAIN: AUTO</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('visCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const timeEl = document.getElementById('system-time');

        // Clock generator
        setInterval(() => {
            const d = new Date();
            timeEl.textContent = `TIME: ${d.toTimeString().split(' ')[0]}`;
        }, 1000);

        let audioCtx, analyser, microphone, dataArray;
        let isInitialized = false;

        overlay.addEventListener('click', async () => {
            if (isInitialized) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                analyser = audioCtx.createAnalyser();
                microphone = audioCtx.createMediaStreamSource(stream);
                
                analyser.fftSize = 64; 
                microphone.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                isInitialized = true;
                overlay.style.display = 'none';
                
                resizeCanvas();
                animate();
            } catch (err) {
                alert('Microphone access denied or unavailable.');
                console.error(err);
            }
        });

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function animate() {
            requestAnimationFrame(animate);
            if (!isInitialized) return;

            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const totalBars = 12; // Exactly 12 frequency ranges
            const totalGaps = totalBars + 1;
            const availableWidth = canvas.width - 40; // Margins
            const barWidth = Math.floor(availableWidth / totalBars) - 8;
            let x = 20;

            for (let i = 0; i < totalBars; i++) {
                const dataIndex = Math.floor(i * (dataArray.length / totalBars));
                let value = dataArray[dataIndex];
                
                const barHeight = (value / 255) * (canvas.height - 30);

                // Phosphor green spectrum styling with intense glow
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#33ff66';
                ctx.fillStyle = '#33ff66';

                // Retro CRT Segment Blocks
                const blockHeight = 6;
                const gap = 3;
                let currentY = canvas.height - 10;
                
                while (currentY > canvas.height - 10 - barHeight) {
                    ctx.fillRect(x, currentY, barWidth, blockHeight);
                    currentY -= (blockHeight + gap);
                }

                // Floating peak indicator line
                if (barHeight > 5) {
                    ctx.fillStyle = '#ffffff'; // White-hot peak
                    ctx.fillRect(x, currentY - 2, barWidth, 2);
                }

                x += barWidth + 8;
            }
            // Reset shadow state
            ctx.shadowBlur = 0;
        }
    </script>
</body>
</html>

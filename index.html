<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AETHELGARD VFD DSP // 12-BAND ANALYZER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #080808;
            font-family: -apple-system, "SF Pro Display", "Courier New", monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hardware Component Chassis / Bezel */
        .cyber-bezel {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, #191a21 0%, #111216 75%, #0d0d0d 100%);
            border: 1px solid rgba(74, 122, 150, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.98);
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            padding-left: max(14px, env(safe-area-inset-left));
            padding-right: max(14px, env(safe-area-inset-right));
        }

        /* Glass Reflection Line + VFD Mesh Overlay */
        .cyber-bezel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0) 40%, rgba(0,0,0,0.25) 100%),
                linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.55) 50%),
                radial-gradient(circle, rgba(74, 122, 150, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 100% 3px, 3px 3px;
            z-index: 6;
            pointer-events: none;
            opacity: 0.9;
        }

        /* 80s Cassette Technical Markings */
        .corner-tag {
            position: absolute;
            font-size: 8px;
            letter-spacing: 1.5px;
            color: rgba(194, 194, 194, 0.25);
            z-index: 5;
            text-transform: uppercase;
            font-family: monospace;
        }
        .tag-tl { top: max(6px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); }
        .tag-tr { top: max(6px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); }
        .tag-bl { bottom: max(6px, env(safe-area-inset-bottom)); left: max(14px, env(safe-area-inset-left)); }
        .tag-br { bottom: max(6px, env(safe-area-inset-bottom)); right: max(14px, env(safe-area-inset-right)); }

        /* VFD Top HUD Header */
        .hud-header {
            height: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            margin-top: 8px;
            color: #2d5066;
            font-size: 9px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(74, 122, 150, 0.15);
            z-index: 4;
            text-shadow: 0 0 6px rgba(45, 80, 102, 0.4);
        }

        .corp-logo {
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #c2c2c2;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .corp-logo::before {
            content: "■";
            font-size: 7px;
            color: #aa4b5a;
        }

        .hud-metrics {
            display: flex;
            gap: 12px;
            color: rgba(194, 194, 194, 0.4);
            font-size: 8px;
            font-family: monospace;
        }

        /* Canvas Viewport */
        .vis-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 4px 0;
            z-index: 2;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* VFD Bottom Status Footer */
        .hud-footer {
            height: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            margin-bottom: 6px;
            color: rgba(194, 194, 194, 0.3);
            font-size: 8px;
            letter-spacing: 1.5px;
            border-top: 1px solid rgba(74, 122, 150, 0.12);
            z-index: 4;
            font-family: monospace;
            text-shadow: 0 0 5px rgba(45, 80, 102, 0.2);
        }

        /* Vintage Boot Overlay */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 13, 13, 0.96);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #2d5066;
            z-index: 20;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
            margin-bottom: 8px;
            color: #c2c2c2;
            text-shadow: 0 0 8px rgba(194, 194, 194, 0.3);
            font-family: monospace;
        }
        #overlay p {
            font-size: 8px;
            letter-spacing: 2px;
            color: rgba(194, 194, 194, 0.35);
            text-transform: uppercase;
            font-family: monospace;
        }

        .boot-seq {
            display: none;
            font-family: monospace;
            font-size: 8px;
            color: #2d5066;
            text-align: left;
            width: 240px;
            margin-top: 15px;
            line-height: 1.7;
            text-shadow: 0 0 6px rgba(45, 80, 102, 0.4);
        }
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(74, 122, 150, 0.15);
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #2d5066;
            box-shadow: 0 0 8px #2d5066;
            transition: width 0.08s linear;
        }
    </style>
</head>
<body>

    <div class="cyber-bezel">
        <div class="corner-tag tag-tl">SYS//06S</div>
        <div class="corner-tag tag-tr">LXS-800</div>
        <div class="corner-tag tag-bl">SEC//OK</div>
        <div class="corner-tag tag-br">AETH.CORP</div>

        <!-- Initializer Overlay -->
        <div id="overlay">
            <div id="start-prompt">
                <h1>AETHELGARD VFD DSP</h1>
                <p>[ TAP SCREEN TO ENGAGE SYSTEM ]</p>
            </div>
            
            <div class="boot-seq" id="boot-seq">
                <div>&gt; POWER_ON // VFD_GRID_INIT</div>
                <div>&gt; DSP_CORE v2.04 ONLINE</div>
                <div>&gt; MIC_ARRAY CALIBRATED</div>
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            </div>
        </div>

        <!-- Top Header -->
        <div class="hud-header">
            <div class="corp-logo">AETHELGARD // LX-12</div>
            <div class="hud-metrics">
                <span>FREQ: 20Hz - 20kHz</span>
                <span id="time-display">00:00:00</span>
            </div>
        </div>

        <!-- Spectrum Viewport -->
        <div class="vis-container">
            <canvas id="visCanvas"></canvas>
        </div>

        <!-- Status Footer -->
        <div class="hud-footer">
            <span>MIC_INPUT: RAW_DIRECT</span>
            <span>DECAY: GRAVITY_SMOOTH</span>
            <span>GAIN: DYNAMIC</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('visCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startPrompt = document.getElementById('start-prompt');
        const bootSeq = document.getElementById('boot-seq');
        const progressFill = document.getElementById('progress-fill');
        const timeEl = document.getElementById('time-display');

        setInterval(() => {
            const now = new Date();
            timeEl.textContent = now.toTimeString().split(' ')[0];
        }, 1000);

        let audioCtx, analyser, microphone, dataArray;
        let isInitialized = false;
        let isBooting = false;

        const BARS_COUNT = 12;
        let currentHeights = new Array(BARS_COUNT).fill(0);
        let peakHeights = new Array(BARS_COUNT).fill(0);
        let peakHoldTimers = new Array(BARS_COUNT).fill(0);

        const FREQ_BOUNDS = [
            [30, 80], [80, 180], [180, 320], [320, 600],
            [600, 1000], [1000, 1800], [1800, 2800], [2800, 4200],
            [4200, 6000], [6000, 8500], [8500, 12000], [12000, 16000]
        ];

        overlay.addEventListener('click', async () => {
            if (isInitialized || isBooting) return;
            isBooting = true;

            startPrompt.style.display = 'none';
            bootSeq.style.display = 'block';

            let progress = 0;
            const bootInterval = setInterval(() => {
                progress += 4;
                progressFill.style.width = `${progress}%`;
                if (progress >= 100) {
                    clearInterval(bootInterval);
                    finishInitialization();
                }
            }, 30);

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        autoGainControl: false,
                        noiseSuppression: false
                    }, 
                    video: false 
                });
                
                analyser = audioCtx.createAnalyser();
                microphone = audioCtx.createMediaStreamSource(stream);
                
                analyser.fftSize = 512; 
                analyser.smoothingTimeConstant = 0.18; 
                microphone.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            } catch (err) {
                alert('Microphone access is required.');
                console.error(err);
                isBooting = false;
                startPrompt.style.display = 'block';
                bootSeq.style.display = 'none';
            }
        });

        function finishInitialization() {
            isInitialized = true;
            overlay.style.display = 'none';
            resizeCanvas();
            animate();
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function animate() {
            requestAnimationFrame(animate);
            if (!isInitialized) return;

            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const paddingX = 10;
            const availableWidth = canvas.width - (paddingX * 2);
            const barGap = Math.max(3, Math.floor(availableWidth * 0.018));
            const barWidth = Math.floor((availableWidth - (barGap * (BARS_COUNT - 1))) / BARS_COUNT);
            let x = paddingX;

            const maxHeight = canvas.height - 10;
            const nyquist = audioCtx.sampleRate / 2;

            const blockHeight = 4;
            const blockGap = 2;
            const maxSegments = Math.floor(maxHeight / (blockHeight + blockGap));

            for (let i = 0; i < BARS_COUNT; i++) {
                const [lowHz, highHz] = FREQ_BOUNDS[i];
                const lowIndex = Math.floor((lowHz / nyquist) * dataArray.length);
                const highIndex = Math.min(
                    Math.ceil((highHz / nyquist) * dataArray.length), 
                    dataArray.length - 1
                );

                let sum = 0;
                let count = 0;
                for (let j = lowIndex; j <= highIndex; j++) {
                    sum += dataArray[j];
                    count++;
                }
                const rawValue = count > 0 ? sum / count : 0;
                const highBoost = 1 + (i * 0.08);
                const targetHeight = (Math.min(255, rawValue * highBoost) / 255) * maxHeight;

                // Physics (Analog Drop)
                if (targetHeight > currentHeights[i]) {
                    currentHeights[i] = targetHeight;
                } else {
                    currentHeights[i] -= 2.2;
                    if (currentHeights[i] < 0) currentHeights[i] = 0;
                }

                if (currentHeights[i] > peakHeights[i]) {
                    peakHeights[i] = currentHeights[i];
                    peakHoldTimers[i] = 12;
                } else {
                    if (peakHoldTimers[i] > 0) {
                        peakHoldTimers[i]--;
                    } else {
                        peakHeights[i] -= 1.0;
                        if (peakHeights[i] < 0) peakHeights[i] = 0;
                    }
                }

                const activeSegments = Math.floor(currentHeights[i] / (blockHeight + blockGap));

                // 1. Unlit Ghost Grid (Plum/Dark Slate Unlit Segments)
                ctx.fillStyle = 'rgba(46, 24, 37, 0.35)';
                for (let seg = 0; seg < maxSegments; seg++) {
                    const segY = canvas.height - 4 - (seg * (blockHeight + blockGap));
                    ctx.fillRect(x, segY, barWidth, blockHeight);
                }

                // 2. Active Illuminated VFD Segments (Darkened Palette)
                for (let seg = 0; seg < activeSegments; seg++) {
                    const segY = canvas.height - 4 - (seg * (blockHeight + blockGap));
                    const ratio = seg / maxSegments;

                    if (ratio < 0.40) {
                        // Toned down #4a7a96 -> Slate Blue
                        ctx.fillStyle = '#2d5066'; 
                        ctx.shadowColor = 'rgba(45, 80, 102, 0.4)';
                    } else if (ratio < 0.65) {
                        // Toned down #333f58 -> Deep Navy Blue
                        ctx.fillStyle = '#1e2738'; 
                        ctx.shadowColor = 'rgba(30, 39, 56, 0.5)';
                    } else if (ratio < 0.82) {
                        // Toned down #cf7862 -> Terracotta
                        ctx.fillStyle = '#8f4d3c'; 
                        ctx.shadowColor = 'rgba(143, 77, 60, 0.55)';
                    } else if (ratio < 0.92) {
                        // Toned down #a75252 -> Muted Rust Red
                        ctx.fillStyle = '#6e3030'; 
                        ctx.shadowColor = 'rgba(110, 48, 48, 0.6)';
                    } else {
                        // Toned down #ee8695 -> Dusky Pink/Coral Red
                        ctx.fillStyle = '#aa4b5a'; 
                        ctx.shadowColor = 'rgba(170, 75, 90, 0.7)';
                    }

                    ctx.shadowBlur = 3;
                    ctx.fillRect(x, segY, barWidth, blockHeight);
                }

                // 3. Floating Peak Indicator Line
                if (peakHeights[i] > 2) {
                    const peakY = canvas.height - 4 - peakHeights[i];
                    ctx.fillStyle = '#c2c2c2';
                    ctx.shadowColor = '#aa4b5a';
                    ctx.shadowBlur = 5;
                    ctx.fillRect(x, peakY, barWidth, 2);
                }

                x += barWidth + barGap;
            }

            ctx.shadowBlur = 0;
        }
    </script>
</body>
</html>

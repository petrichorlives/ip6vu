<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aethelgard Audio Works - LX-12 Precision Audio Processor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #050405;
            font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Enclosure Chassis Frame */
        .vfd-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, #151316 0%, #0c0b0d 85%, #050405 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            gap: 8px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
        }

        /* Scanline Overlay */
        .vfd-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.45) 50%),
                radial-gradient(circle, rgba(238, 134, 149, 0.02) 1px, transparent 1px);
            background-size: 100% 3px, 4px 4px;
            z-index: 6;
            pointer-events: none;
            opacity: 0.85;
        }

        /* Industrial Corner Hex Screw Heads */
        .corner-screw {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2528 0%, #0d0c0e 100%);
            border: 1px solid rgba(119, 58, 77, 0.4);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .corner-screw::after {
            content: "";
            width: 5px;
            height: 1.5px;
            background: rgba(119, 58, 77, 0.6);
            transform: rotate(45deg);
        }
        .screw-tl { top: 6px; left: 6px; }
        .screw-tr { top: 6px; right: 6px; }
        .screw-bl { bottom: 6px; left: 6px; }
        .screw-br { bottom: 6px; right: 6px; }

        /* Top Faceplate Header Frame */
        .vfd-header {
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            z-index: 4;
        }

        /* Recessed Modular Bays */
        .faceplate-bay {
            background: #09080a;
            border: 1px solid rgba(119, 58, 77, 0.25);
            border-top-color: rgba(0, 0, 0, 0.9);
            border-left-color: rgba(0, 0, 0, 0.9);
            border-radius: 3px;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.95), 0 1px 0 rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            padding: 0 10px;
            position: relative;
        }

        .name-bay {
            height: 100%;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Louvered Vent Grille Module */
        .vent-bay {
            height: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            overflow: hidden;
        }

        .vent-grille {
            width: 100%;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .vent-slat {
            width: 100%;
            height: 2px;
            background: linear-gradient(180deg, #040304 0%, #1c171a 100%);
            border-bottom: 1px solid rgba(119, 58, 77, 0.35);
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.8);
        }

        .clock-bay {
            height: 100%;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Hardware Status Indicators (LED Array) */
        .led-array {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-right: 6px;
            border-right: 1px solid rgba(119, 58, 77, 0.2);
        }

        .led-node {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #1e1217;
            border: 1px solid rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .led-node.active-pwr {
            background: #ee8695;
            box-shadow: 0 0 6px #ee8695;
        }

        .led-node.active-dsp {
            background: #cf7862;
            box-shadow: 0 0 6px #cf7862;
        }

        .device-name {
            font-size: 8.5px;
            letter-spacing: 2.2px;
            color: rgba(238, 134, 149, 0.7);
            font-weight: 700;
            text-transform: uppercase;
        }

        .time-display {
            font-size: 9px;
            letter-spacing: 1.5px;
            color: rgba(207, 120, 98, 0.65);
            font-family: monospace;
        }

        /* Visualizer Main Bay Housing */
        .vis-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 2;
            overflow: hidden;
            padding: 22px 14px 18px 14px;
        }

        /* Side Gain Tick Marks */
        .side-ticks {
            position: absolute;
            left: 4px;
            top: 24px;
            bottom: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            z-index: 3;
        }

        .tick-line {
            width: 4px;
            height: 1px;
            background: rgba(119, 58, 77, 0.4);
        }
        .tick-line.major {
            width: 7px;
            background: rgba(238, 134, 149, 0.5);
        }

        /* Frequency Channel Labels Bar */
        .freq-legend-bar {
            width: 100%;
            height: 12px;
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 14px;
            pointer-events: none;
            z-index: 4;
        }

        .freq-label {
            font-family: monospace;
            font-size: 7px;
            color: rgba(207, 120, 98, 0.45);
            text-align: center;
            letter-spacing: 0.5px;
        }

        canvas {
            position: absolute;
            top: 20px;
            left: 14px;
            right: 14px;
            bottom: 18px;
            width: calc(100% - 28px);
            height: calc(100% - 38px);
        }

        /* --- 80s Corporate Tech Startup Overlay --- */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #09080a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            cursor: pointer;
            padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        }

        .center-branding {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        /* 80s High-Tech Interlocking AAW Monogram Crest */
        .logo-mark {
            width: 170px;
            height: 75px;
            margin-bottom: 22px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-mark svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 14px rgba(238, 134, 149, 0.45));
        }

        /* Corporate Title Header */
        .brand-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #ee8695;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ee8695 0%, #cf7862 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(238, 134, 149, 0.25);
            margin-bottom: 6px;
            position: relative;
        }

        .brand-subtitle {
            font-size: 9.5px;
            letter-spacing: 8px;
            color: rgba(207, 120, 98, 0.85);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 12px;
            border-top: 1px solid rgba(119, 58, 77, 0.35);
            border-bottom: 1px solid rgba(119, 58, 77, 0.35);
            padding: 4px 0;
            width: 100%;
            max-width: 310px;
        }

        .brand-copyright {
            font-size: 8px;
            letter-spacing: 2px;
            color: rgba(119, 58, 77, 0.7);
            font-family: monospace;
        }

        .start-prompt {
            margin-top: 24px;
            font-size: 8.5px;
            letter-spacing: 2.5px;
            color: rgba(238, 134, 149, 0.65);
            text-transform: uppercase;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.95; }
        }

        /* Bottom Status Housing & Thicker Loading Bar */
        .status-bar-container {
            width: 100%;
            background: rgba(14, 12, 15, 0.94);
            border: 1px solid rgba(119, 58, 77, 0.35);
            border-radius: 4px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.9), 0 2px 12px rgba(0,0,0,0.6);
        }

        .status-readouts {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 8.5px;
            letter-spacing: 1.5px;
            color: rgba(207, 120, 98, 0.85);
            text-transform: uppercase;
        }

        .status-readouts span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-indicator {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ee8695;
            box-shadow: 0 0 6px #ee8695;
        }

        /* Thicker Loading Bar (6px) */
        .boot-progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(50, 30, 42, 0.65);
            border: 1px solid rgba(119, 58, 77, 0.25);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .boot-progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #543246 0%, #773a4d 40%, #cf7862 75%, #ee8695 100%);
            box-shadow: 0 0 10px rgba(238, 134, 149, 0.75);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <!-- Chassis Corner Screws -->
    <div class="corner-screw screw-tl"></div>
    <div class="corner-screw screw-tr"></div>
    <div class="corner-screw screw-bl"></div>
    <div class="corner-screw screw-br"></div>

    <div class="vfd-container">

        <!-- Startup Screen Overlay -->
        <div id="overlay">
            <div class="center-branding">
                
                <!-- 80s Precision Corporate AAW Logo Mark -->
                <div class="logo-mark">
                    <svg viewBox="0 0 220 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="aawGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ee8695" />
                                <stop offset="100%" stop-color="#a75252" />
                            </linearGradient>
                            <linearGradient id="aawGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#cf7862" />
                                <stop offset="100%" stop-color="#773a4d" />
                            </linearGradient>
                        </defs>

                        <!-- Outer Emblem Octagonal Frame -->
                        <path d="M15 15 L35 2 L185 2 L205 15 L205 65 L185 78 L35 78 L15 65 Z" fill="#09080a" stroke="rgba(119, 58, 77, 0.5)" stroke-width="1.5" />
                        
                        <!-- Lined Interlocking Speed Cuts for 'A 1' -->
                        <g id="mono-A1">
                            <!-- Slanted Geometric Legs -->
                            <path d="M28 66 L52 14 H62 L38 66 Z" fill="url(#aawGrad1)" />
                            <path d="M42 66 L66 14 H76 L52 66 Z" fill="#773a4d" />
                            <!-- Crossbar Segment Array -->
                            <rect x="36" y="38" width="28" height="3" fill="#ee8695" />
                            <rect x="34" y="44" width="28" height="2" fill="#cf7862" opacity="0.8" />
                        </g>

                        <!-- Lined Interlocking Speed Cuts for 'A 2' -->
                        <g id="mono-A2">
                            <path d="M72 66 L96 14 H106 L82 66 Z" fill="url(#aawGrad1)" />
                            <path d="M86 66 L110 14 H120 L96 66 Z" fill="#a75252" />
                            <!-- Crossbar Segment Array -->
                            <rect x="80" y="38" width="28" height="3" fill="#ee8695" />
                            <rect x="78" y="44" width="28" height="2" fill="#cf7862" opacity="0.8" />
                        </g>

                        <!-- High-Tech Chevron 'W' -->
                        <g id="mono-W">
                            <path d="M124 14 L142 66 H151 L133 14 Z" fill="url(#aawGrad2)" />
                            <path d="M142 66 L158 24 H167 L151 66 Z" fill="#ee8695" />
                            <path d="M158 24 L174 66 H183 L167 24 Z" fill="url(#aawGrad1)" />
                            <path d="M174 66 L192 14 H201 L183 66 Z" fill="#773a4d" />
                        </g>

                        <!-- Precision Grid Calibration Marks -->
                        <line x1="25" y1="72" x2="195" y2="72" stroke="#ee8695" stroke-width="1.5" stroke-dasharray="8 3" opacity="0.85" />
                        <line x1="35" y1="8" x2="185" y2="8" stroke="#cf7862" stroke-width="1" stroke-dasharray="4 2" opacity="0.6" />
                    </svg>
                </div>

                <div class="brand-title">Aethelgard</div>
                <div class="brand-subtitle">Audio Works</div>
                <div class="brand-copyright">SYSTEM ARCHITECTURE // MODEL LX-12</div>

                <div class="start-prompt" id="start-prompt">[ tap screen to initialize ]</div>
            </div>

            <!-- Bottom Status Readout Bar -->
            <div class="status-bar-container">
                <div class="status-readouts">
                    <span><i class="status-indicator"></i><span id="sys-status">SYS_OFF</span></span>
                    <span id="status-line">READY TO INITIALIZE</span>
                    <span id="pct-display">00%</span>
                </div>
                <div class="boot-progress-bar">
                    <div class="boot-progress-fill" id="progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- Visualizer Header -->
        <div class="vfd-header">
            <div class="faceplate-bay name-bay">
                <div class="led-array">
                    <div class="led-node active-pwr" title="POWER"></div>
                    <div class="led-node active-dsp" title="DSP"></div>
                </div>
                <div class="device-name">Aethelgard Audio Works</div>
            </div>

            <!-- Recessed Louvered Vent Bay -->
            <div class="faceplate-bay vent-bay">
                <div class="vent-grille">
                    <div class="vent-slat"></div>
                    <div class="vent-slat"></div>
                    <div class="vent-slat"></div>
                    <div class="vent-slat"></div>
                </div>
            </div>

            <div class="faceplate-bay clock-bay">
                <div class="time-display" id="time-display">00:00:00</div>
            </div>
        </div>

        <!-- Visualizer Canvas Bay -->
        <div class="vis-container faceplate-bay">
            <!-- Gain Tick Mark Rulers -->
            <div class="side-ticks">
                <div class="tick-line major"></div>
                <div class="tick-line"></div>
                <div class="tick-line"></div>
                <div class="tick-line major"></div>
                <div class="tick-line"></div>
                <div class="tick-line"></div>
                <div class="tick-line major"></div>
            </div>

            <canvas id="visCanvas"></canvas>

            <!-- Channel Frequency Readouts Legend -->
            <div class="freq-legend-bar" id="freq-legend">
                <div class="freq-label">30</div>
                <div class="freq-label">80</div>
                <div class="freq-label">180</div>
                <div class="freq-label">320</div>
                <div class="freq-label">600</div>
                <div class="freq-label">1K</div>
                <div class="freq-label">1.8K</div>
                <div class="freq-label">2.8K</div>
                <div class="freq-label">4.2K</div>
                <div class="freq-label">6K</div>
                <div class="freq-label">8.5K</div>
                <div class="freq-label">16K</div>
            </div>
        </div>
    </div>


    <script>
        const canvas = document.getElementById('visCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startPrompt = document.getElementById('start-prompt');
        const sysStatus = document.getElementById('sys-status');
        const statusLine = document.getElementById('status-line');
        const pctDisplay = document.getElementById('pct-display');
        const progressFill = document.getElementById('progress-fill');
        const timeEl = document.getElementById('time-display');

        setInterval(() => {
            const now = new Date();
            timeEl.textContent = now.toTimeString().split(' ')[0];
        }, 1000);

        let audioCtx, analyser, microphone, dataArray;
        let isInitialized = false;
        let isBooting = false;

        const BARS_COUNT = 12;
        let currentHeights = new Array(BARS_COUNT).fill(0);
        let peakHeights = new Array(BARS_COUNT).fill(0);
        let peakHoldTimers = new Array(BARS_COUNT).fill(0);

        const FREQ_BOUNDS = [
            [30, 80], [80, 180], [180, 320], [320, 600],
            [600, 1000], [1000, 1800], [1800, 2800], [2800, 4200],
            [4200, 6000], [6000, 8500], [8500, 12000], [12000, 16000]
        ];

        overlay.addEventListener('click', async () => {
            if (isInitialized || isBooting) return;
            isBooting = true;

            startPrompt.style.display = 'none';
            sysStatus.textContent = "SYS_BOOT";

            try {
                // Request microphone access
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        autoGainControl: false,
                        noiseSuppression: false
                    }, 
                    video: false 
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                microphone = audioCtx.createMediaStreamSource(stream);
                
                analyser.fftSize = 512; 
                // Ultra-snappy response timing
                analyser.smoothingTimeConstant = 0.08; 
                microphone.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                // Multi-stage status sequence
                const bootSteps = [
                    { pct: 20, text: "BUS_INITIALIZING" },
                    { pct: 45, text: "CALIBRATING_DSP" },
                    { pct: 75, text: "ANALOG_LOCK_OK" },
                    { pct: 100, text: "SYSTEM_ONLINE" }
                ];

                let currentStep = 0;
                let progress = 0;

                const bootInterval = setInterval(() => {
                    progress += 1;
                    progressFill.style.width = `${progress}%`;
                    pctDisplay.textContent = `${String(progress).padStart(2, '0')}%`;

                    if (currentStep < bootSteps.length && progress >= bootSteps[currentStep].pct) {
                        statusLine.textContent = bootSteps[currentStep].text;
                        currentStep++;
                    }

                    if (progress >= 100) {
                        clearInterval(bootInterval);
                        setTimeout(finishInitialization, 300);
                    }
                }, 40);

            } catch (err) {
                alert('Microphone access is required to run the visualizer.');
                console.error(err);
                isBooting = false;
                startPrompt.style.display = 'block';
                sysStatus.textContent = "SYS_OFF";
                statusLine.textContent = "READY TO INITIALIZE";
            }
        });

        function finishInitialization() {
            isInitialized = true;
            overlay.style.display = 'none';
            resizeCanvas();
            animate();
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth - 28;
            canvas.height = canvas.parentElement.clientHeight - 38;
        }
        window.addEventListener('resize', resizeCanvas);

        function animate() {
            requestAnimationFrame(animate);
            if (!isInitialized) return;

            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const paddingX = 4;
            const availableWidth = canvas.width - (paddingX * 2);
            
            // Reduced horizontal bar gap padding by 35% compared to previous version
            const barGap = Math.max(4, Math.floor(availableWidth * 0.0228));
            const barWidth = Math.max(8, Math.floor((availableWidth - (barGap * (BARS_COUNT - 1))) / BARS_COUNT));
            
            // Recenter bar cluster
            const totalWidth = (barWidth * BARS_COUNT) + (barGap * (BARS_COUNT - 1));
            let x = Math.floor((canvas.width - totalWidth) / 2);

            const maxHeight = canvas.height - 4;
            const nyquist = audioCtx.sampleRate / 2;

            // Increased vertical spacing between stacked segments by 15% (blockGap: 2.3px)
            const blockHeight = 4;
            const blockGap = 2.3;
            const maxSegments = Math.floor(maxHeight / (blockHeight + blockGap));

            for (let i = 0; i < BARS_COUNT; i++) {
                const [lowHz, highHz] = FREQ_BOUNDS[i];
                const lowIndex = Math.floor((lowHz / nyquist) * dataArray.length);
                const highIndex = Math.min(
                    Math.ceil((highHz / nyquist) * dataArray.length), 
                    dataArray.length - 1
                );

                let sum = 0;
                let count = 0;
                for (let j = lowIndex; j <= highIndex; j++) {
                    sum += dataArray[j];
                    count++;
                }
                const rawValue = count > 0 ? sum / count : 0;
                const highBoost = 1 + (i * 0.07);
                const targetHeight = (Math.min(255, rawValue * highBoost) / 255) * maxHeight;

                // Physics (Snappy hit, linear drop)
                if (targetHeight > currentHeights[i]) {
                    currentHeights[i] = targetHeight;
                } else {
                    currentHeights[i] -= 3.2;
                    if (currentHeights[i] < 0) currentHeights[i] = 0;
                }

                if (currentHeights[i] > peakHeights[i]) {
                    peakHeights[i] = currentHeights[i];
                    peakHoldTimers[i] = 10;
                } else {
                    if (peakHoldTimers[i] > 0) {
                        peakHoldTimers[i]--;
                    } else {
                        peakHeights[i] -= 1.2;
                        if (peakHeights[i] < 0) peakHeights[i] = 0;
                    }
                }

                const activeSegments = Math.floor(currentHeights[i] / (blockHeight + blockGap));

                // 1. Unlit Ghost Segments
                ctx.fillStyle = 'rgba(84, 50, 70, 0.16)';
                for (let seg = 0; seg < maxSegments; seg++) {
                    const segY = canvas.height - 2 - (seg * (blockHeight + blockGap));
                    ctx.fillRect(x, segY, barWidth, blockHeight);
                }

                // 2. Active Illuminated VFD Segments
                for (let seg = 0; seg < activeSegments; seg++) {
                    const segY = canvas.height - 2 - (seg * (blockHeight + blockGap));
                    const ratio = seg / maxSegments;

                    if (ratio < 0.35) {
                        ctx.fillStyle = '#543246'; 
                        ctx.shadowColor = 'rgba(84, 50, 70, 0.3)';
                    } else if (ratio < 0.60) {
                        ctx.fillStyle = '#773a4d'; 
                        ctx.shadowColor = 'rgba(119, 58, 77, 0.4)';
                    } else if (ratio < 0.80) {
                        ctx.fillStyle = '#a75252'; 
                        ctx.shadowColor = 'rgba(167, 82, 82, 0.45)';
                    } else if (ratio < 0.92) {
                        ctx.fillStyle = '#cf7862'; 
                        ctx.shadowColor = 'rgba(207, 120, 98, 0.5)';
                    } else {
                        ctx.fillStyle = '#ee8695'; 
                        ctx.shadowColor = 'rgba(238, 134, 149, 0.6)';
                    }

                    ctx.shadowBlur = 3;
                    ctx.fillRect(x, segY, barWidth, blockHeight);
                }

                // 3. Floating Peak Cap
                if (peakHeights[i] > 2) {
                    const peakY = canvas.height - 2 - peakHeights[i];
                    ctx.fillStyle = '#ee8695';
                    ctx.shadowColor = '#ee8695';
                    ctx.shadowBlur = 4;
                    ctx.fillRect(x, peakY, barWidth, 2);
                }

                x += barWidth + barGap;
            }

            ctx.shadowBlur = 0;
        }
    </script>
</body>
</html>

<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body,html{width:100vw;height:100vh;height:100dvh;background:#050611;font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;overflow:hidden;display:flex;justify-content:center;align-items:center}
.vfd-container{width:100vw;height:100vh;height:100dvh;background:radial-gradient(circle at center,#121326 0%,#090b18 85%,#050611 100%);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;gap:8px;
padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.chassis-screw{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#3a3237 0%,#151214 90%);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 2px rgba(0,0,0,.8);z-index:30}
.chassis-screw::after{content:"";position:absolute;top:3px;left:1px;width:6px;height:1px;background:rgba(0,0,0,.8)}
.screw-tl{top:6px;left:6px}.screw-tr{top:6px;right:6px}.screw-bl{bottom:6px;left:6px}.screw-br{bottom:6px;right:6px}
.vfd-container::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.45) 50%),radial-gradient(circle,rgba(105,190,213,.025) 1px,transparent 1px);background-size:100% 3px,4px 4px;z-index:40;pointer-events:none;opacity:.85}

.faceplate-bay{background:#080709;border:1px solid rgba(103,113,157,.25);border-top-color:rgba(0,0,0,.85);border-left-color:rgba(0,0,0,.85);border-radius:3px;box-shadow:inset 0 1px 4px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.03);display:flex;align-items:center;padding:0 10px}
.name-bay{height:100%;flex:0 1 auto;gap:8px}

/* Power-on flicker for the main faceplate */

@keyframes flick{0%{opacity:0}8%{opacity:.9}14%{opacity:.1}26%{opacity:1}34%{opacity:.35}46%{opacity:1}100%{opacity:1}}

padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));

@keyframes pulse-glow{0%,100%{opacity:.35}50%{opacity:.95}}
.boot-stage{width:100%;margin-top:12px;display:none}

.boot-progress-fill{width:0%;height:100%;background:linear-gradient(90deg,#30334f,#51466e 40%,#83b7c7 75%,#d99ab9);box-shadow:0 0 10px rgba(238,134,149,.8)}

<body>

      <span>30Hz</span><span>60</span><span>120</span><span>250</span><span>500</span><span>1k</span><span>2k</span><span>4k</span><span>8k</span><span>16kHz</span>

<script>
const $ = id => document.getElementById(id);
const canvas = $('visCanvas'), ctx = canvas.getContext('2d');
const bootCanvas = $('bootCanvas'), bctx = bootCanvas.getContext('2d');
const gaugeCanvas = $('gaugeCanvas'), gctx = gaugeCanvas.getContext('2d');
const overlay = $('overlay'), chassis = $('chassis'), logoFrame = $('logoFrame');

setInterval(() => { $('time-display').textContent = new Date().toTimeString().split(' ')[0]; }, 1000);

const BARS = 24;
// Logarithmic bands preserve useful low-frequency detail while spreading the highs.
const FREQ_BOUNDS = Array.from({length:BARS}, (_, i) => {
  const minHz = 30, maxHz = 16000;
  const lo = minHz * Math.pow(maxHz / minHz, i / BARS);
  const hi = minHz * Math.pow(maxHz / minHz, (i + 1) / BARS);
  return [lo, hi];
});
const COLORS = ['#34304f','#51416d','#72527f','#94617f','#bd7188','#d59a9b'];
const BLOCK_H = 3, BLOCK_GAP = 1.7, STEP = BLOCK_H + BLOCK_GAP;

let audioCtx, analyser, dataArray, waveformArray, binRanges;
let isInitialized = false, isBooting = false, micReady = false, bootRAF = 0, micStream = null;

const heights = new Float32Array(BARS), peaks = new Float32Array(BARS), peakTimers = new Float32Array(BARS), prevTarget = new Float32Array(BARS);

/* ---------- canvas helpers (retina-aware) ---------- */
function setupCanvas(c, cx) {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  c._w = c.clientWidth; c._h = c.clientHeight;
  c.width = Math.round(c._w * dpr); c.height = Math.round(c._h * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function resizeAll() { setupCanvas(canvas, ctx); setupCanvas(bootCanvas, bctx); setupCanvas(gaugeCanvas, gctx); }
window.addEventListener('resize', resizeAll);

/* ---------- instrument panel renderer ---------- */
function drawInstrumentPanel(cx, x, y, w, h, label) {
  // Matte, recessed instrument wells: restrained edge highlights, no glass effect.
  const g = cx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#080a14');
  g.addColorStop(.48, '#0b0d19');
  g.addColorStop(1, '#060710');
  cx.fillStyle = g;
  cx.fillRect(x, y, w, h);

  cx.strokeStyle = 'rgba(107,119,157,.34)';
  cx.lineWidth = 1;
  cx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  cx.strokeStyle = 'rgba(0,0,0,.85)';
  cx.beginPath();
  cx.moveTo(x + 1, y + h - 1);
  cx.lineTo(x + w - 1, y + h - 1);
  cx.moveTo(x + w - 1, y + 1);
  cx.lineTo(x + w - 1, y + h - 1);
  cx.stroke();

  if (label) {
    cx.font = '6px monospace';
    cx.textBaseline = 'alphabetic';
    cx.textAlign = 'left';
    cx.fillStyle = 'rgba(151,166,194,.68)';
    cx.fillText(label, x + 7, y + 9);
    cx.fillStyle = 'rgba(217,154,185,.5)';
    cx.fillRect(x + 7, y + 12, Math.min(24, w * .12), 1);
  }
}

/* Shared renderer.
   Boot mode intentionally draws only the lamp-test spectrum. The live-only
   oscillator and bass meter are enabled after the boot sequence completes. */
function drawBars(c, cx, hts, pks, waveform = null, bassLevel = 0, live = false) {
  const w = c._w, h = c._h;
  cx.clearRect(0, 0, w, h);

  const bg = cx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#0d1020');
  bg.addColorStop(.55, '#0b0b18');
  bg.addColorStop(1, '#050711');
  cx.fillStyle = bg;
  cx.fillRect(0, 0, w, h);

  const padX = 8;
  const avail = Math.max(1, w - padX * 2);
  let spectrumTop = 5;
  let baseY = h - 5;

  if (live && waveform) {
    // Give the oscillator a real instrument well with a height that scales
    // sensibly in both portrait and landscape orientations.
    const oscTop = 5;
    const oscH = clamp(h * .235, 48, 112);
    const midY = oscTop + oscH * .55;
    const amp = oscH * .39;
    drawInstrumentPanel(cx, padX, oscTop, avail, oscH, 'SIGNAL / TIME DOMAIN');

    // Fine centerline and restrained upper/lower reference marks.
    cx.strokeStyle = 'rgba(112,139,176,.23)';
    cx.lineWidth = 1;
    cx.beginPath();
    cx.moveTo(padX + 5, midY);
    cx.lineTo(w - padX - 5, midY);
    cx.stroke();
    cx.strokeStyle = 'rgba(112,132,172,.13)';
    cx.setLineDash([2, 5]);
    cx.beginPath();
    cx.moveTo(padX + 5, oscTop + 17);
    cx.lineTo(w - padX - 5, oscTop + 17);
    cx.moveTo(padX + 5, oscTop + oscH - 5);
    cx.lineTo(w - padX - 5, oscTop + oscH - 5);
    cx.stroke();
    cx.setLineDash([]);

    // Remove DC offset and apply adaptive gain so ordinary listening levels
    // produce a readable trace without requiring hard clipping or loud peaks.
    let mean = 0;
    for (let i = 0; i < waveform.length; i++) mean += waveform[i];
    mean /= waveform.length;
    let sumSq = 0;
    for (let i = 0; i < waveform.length; i++) {
      const v = (waveform[i] - mean) / 128;
      sumSq += v * v;
    }
    const rms = Math.sqrt(sumSq / waveform.length);
    const adaptiveGain = clamp(0.30 / (rms + 0.018), 1.5, 5.5);

    cx.beginPath();
    const sampleStep = Math.max(1, Math.floor(waveform.length / Math.max(1, avail)));
    let first = true;
    for (let i = 0; i < waveform.length; i += sampleStep) {
      const raw = (waveform[i] - mean) / 128;
      const shaped = Math.tanh(raw * adaptiveGain * 2.15);
      const x = padX + 5 + (i / (waveform.length - 1)) * (avail - 10);
      const y = midY - shaped * amp;
      if (first) { cx.moveTo(x, y); first = false; }
      else cx.lineTo(x, y);
    }
    cx.lineJoin = 'round';
    cx.lineCap = 'round';
    cx.strokeStyle = 'rgba(103,202,216,.18)';
    cx.lineWidth = 4;
    cx.stroke();
    cx.strokeStyle = '#a4cbd3';
    cx.lineWidth = 1.35;
    cx.stroke();

    // Individual low-frequency meter well, with a thicker readable bar.
    const bassY = oscTop + oscH + 8;
    const bassH = 12;
    drawInstrumentPanel(cx, padX, bassY - 3, avail, 31, 'LOW / BASS ENERGY');
    const meterX = padX + 7;
    const meterW = avail - 14;
    cx.fillStyle = 'rgba(58,61,91,.58)';
    cx.fillRect(meterX, bassY + 11, meterW, bassH);
    cx.strokeStyle = 'rgba(129,145,178,.28)';
    cx.strokeRect(meterX + .5, bassY + 11.5, meterW - 1, bassH - 1);

    // Quiet calibration ticks make the bar feel like a physical instrument.
    cx.strokeStyle = 'rgba(170,181,205,.24)';
    cx.lineWidth = 1;
    for (let i = 1; i < 8; i++) {
      const tx = meterX + meterW * i / 8;
      cx.beginPath();
      cx.moveTo(tx, bassY + 8);
      cx.lineTo(tx, bassY + 10);
      cx.stroke();
    }

    const level = clamp(bassLevel);
    const fillW = Math.max(0, (meterW - 2) * level);
    const bassGrad = cx.createLinearGradient(meterX, 0, meterX + meterW, 0);
    bassGrad.addColorStop(0, '#59618b');
    bassGrad.addColorStop(.58, '#7d829f');
    bassGrad.addColorStop(1, '#d69ab5');
    cx.fillStyle = bassGrad;
    if (fillW > 0) cx.fillRect(meterX + 1, bassY + 12, fillW, bassH - 2);

    spectrumTop = bassY + 35;
    baseY = h - 18;
  }

  // Separate recessed well for the 24-band segmented spectrum.
  const top = live && waveform ? Math.min(spectrumTop, baseY - 28) : 18;
  const panelY = top - 14;
  const panelH = Math.max(24, baseY - top + 22);
  drawInstrumentPanel(cx, padX, panelY, avail, panelH, '24-BAND FREQUENCY SPECTRUM');

  const maxH = Math.max(8, baseY - top);
  const gap = Math.max(1, Math.floor(avail * .006));
  const bw = Math.max(1.5, (avail - gap * (BARS - 1)) / BARS);
  const maxSeg = Math.max(1, Math.floor(maxH / STEP));

  const ghost = new Path2D();
  const paths = COLORS.map(() => new Path2D());
  const glow = new Path2D(), caps = new Path2D();
  let x = padX + 1;

  for (let i = 0; i < BARS; i++) {
    for (let s = 0; s < maxSeg; s++) ghost.rect(x, baseY - s * STEP, bw, BLOCK_H);
    const active = Math.min(maxSeg, Math.floor(hts[i] / STEP));
    for (let s = 0; s < active; s++) {
      const r = s / maxSeg;
      const ci = r < .25 ? 0 : r < .43 ? 1 : r < .60 ? 2 : r < .75 ? 3 : r < .89 ? 4 : 5;
      paths[ci].rect(x, baseY - s * STEP, bw, BLOCK_H);
    }
    if (active > 0) {
      const ty = baseY - (active - 1) * STEP;
      glow.rect(x - 1, ty - 2, bw + 2, BLOCK_H + 4);
    }
    if (pks[i] > 2) caps.rect(x, baseY - Math.min(maxH, pks[i]), bw, 1.5);
    x += bw + gap;
  }

  cx.fillStyle = 'rgba(74,74,112,.22)';
  cx.fill(ghost);
  cx.fillStyle = 'rgba(103,185,205,.10)';
  cx.fill(glow);
  COLORS.forEach((col, i) => { cx.fillStyle = col; cx.fill(paths[i]); });
  cx.fillStyle = '#d6a2bd';
  cx.fill(caps);

  if (live) {
    cx.fillStyle = 'rgba(132,148,183,.38)';
    cx.fillRect(padX + 5, baseY + 3, avail - 10, 1);
  }
}

/* ---------- boot sequence: night-noir VIP sedan welcome (7s) ---------- */
const DUR = 7000;
const LOG = [
  [300,  'VAW-80 FIRMWARE 2.4',    'OK'],
  [1100, 'MIC BUS HANDSHAKE',      'LOCK'],
  [1900, 'ANALOG STAGE WARM-UP',   'OK'],
  [2800, 'CABIN ACOUSTIC PROFILE', 'FLAT'],
  [3800, '2048-PT FFT / 24 BAND',  'OK'],
  [4800, 'VFD SEGMENT TEST',       'RUN'],
  [5900, 'ALL SYSTEMS',            'NOMINAL']
];
const STAGES = [[0,'COLD_START'],[15,'WARMING_TUBES'],[30,'GAUGE_SELF_CHECK'],[55,'SIGNAL_PATH_OK'],[78,'SEGMENT_TEST'],[93,'ALL_SYSTEMS_GO'],[100,'SYSTEM_ONLINE']];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = x => x * x * (3 - 2 * x);

// Optitron-style gauge: ticks weld on one by one, needle sweeps to redline, then settles
function drawGauge(t) {
  const w = gaugeCanvas._w, h = gaugeCanvas._h, g = gctx;
  g.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h - 8, R = Math.min(h - 14, w * 0.36), N = 31;
  const lit = clamp((t - 900) / 1100) * N;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '7px monospace';
  for (let i = 0; i < N; i++) {
    const f = i / (N - 1), a = Math.PI + f * Math.PI, major = i % 5 === 0;
    const col = f > .85 ? '#d99ab9' : f > .7 ? '#83b7c7' : '#a8c5d1';
    const on = i < lit;
    const cos = Math.cos(a), sin = Math.sin(a), r1 = R - (major ? 11 : 6);
    g.strokeStyle = on ? col : 'rgba(119,58,77,.22)';
    g.lineWidth = major ? 2 : 1;
    g.shadowColor = col; g.shadowBlur = on ? 6 : 0;
    g.beginPath(); g.moveTo(cx + cos * r1, cy + sin * r1); g.lineTo(cx + cos * R, cy + sin * R); g.stroke();
    if (major && on) { g.shadowBlur = 0; g.fillStyle = 'rgba(232,200,154,.7)'; g.fillText(i / 5, cx + cos * (R - 20), cy + sin * (R - 20)); }
  }
  if (t > 800) {
    let v;
    if (t < 2000) v = 0;
    else if (t < 3300) v = 1 - Math.pow(1 - (t - 2000) / 1300, 3);
    else if (t < 4400) v = 1 - 0.86 * smooth((t - 3300) / 1100);
    else v = 0.14 + 0.012 * Math.sin(t * 0.012);
    const a = Math.PI + v * Math.PI, cos = Math.cos(a), sin = Math.sin(a);
    g.strokeStyle = '#d99ab9'; g.shadowColor = '#d99ab9'; g.shadowBlur = 8; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx + cos * 8, cy + sin * 8); g.lineTo(cx + cos * (R - 3), cy + sin * (R - 3)); g.stroke();
    g.fillStyle = '#a8c5d1'; g.shadowColor = '#a8c5d1'; g.beginPath(); g.arc(cx, cy, 3, 0, 7); g.fill();
  }
  g.shadowBlur = 0;
}

function bootFrame(t0) {
  return function loop(now) {
    const t = now - t0;
    bootRAF = requestAnimationFrame(loop);

    // logo: power-cycle dip, then slow fade up and a breathing champagne glow
    logoFrame.style.opacity = t < 300 ? 1 - 0.95 * (t / 300) : 0.05 + 0.95 * smooth(clamp((t - 300) / 1500));
    const br = 0.5 + 0.5 * Math.sin(t * 0.004);
    logoFrame.style.filter = `drop-shadow(0 0 ${12 + 14 * br}px rgba(232,200,154,${0.12 + 0.14 * br}))`;

    // headlight streaks sweep across the screen twice
    const s1 = (t - 500) / 1300, s2 = (t - 5700) / 1000;
    const p = s1 >= 0 && s1 <= 1 ? s1 : s2 >= 0 && s2 <= 1 ? s2 : -1;
    $('streak').style.opacity = p < 0 ? 0 : 1;
    if (p >= 0) $('streak').style.left = (p * 150 - 30) + '%';

    // terminal log (last 6 lines), typed out
    const lines = [];
    for (const [at, label, status] of LOG) {
      if (t < at) break;
      lines.push('> ' + (label.padEnd(26, '.') + ' ' + status).slice(0, Math.floor((t - at) / 16)));
    }
    if (lines.length && Math.floor(t / 300) % 2) lines[lines.length - 1] += '_';
    $('bootLog').textContent = lines.slice(-6).join('\n');

    drawGauge(t);

    // lamp-test bars: wave, left-to-right sweep, staggered drop
    const maxH = bootCanvas._h - 18;
    for (let i = 0; i < BARS; i++) {
      let f = 0;
      if (t > 3000 && t < 5000) f = (0.5 + 0.5 * Math.sin((t - 3000) * 0.006 - i * 0.55)) * clamp((t - 3000) / 600) * 0.85;
      else if (t >= 5000 && t < 5900) f = clamp(((t - 5000) / 900) * (BARS + 3) - i);
      else if (t >= 5900) f = clamp(1 - (t - 5900 - i * 30) / 420);
      heights[i] = f * maxH; peaks[i] = f * maxH;
    }
    drawBars(bootCanvas, bctx, heights, peaks, null, 0, false);

    $('welcome').style.opacity = clamp((t - 5900) / 700);

    const pct = Math.floor(smooth(clamp(t / DUR)) * 100);
    $('progress-fill').style.width = pct + '%';
    $('pct-display').textContent = String(pct).padStart(2, '0') + '%';
    let st = STAGES[0][1]; for (const [q, txt] of STAGES) if (pct >= q) st = txt;
    $('status-line').textContent = st;

    if (t >= DUR) { cancelAnimationFrame(bootRAF); finishBoot(); }
  };
}

function finishBoot() {
  if (audioCtx.state !== 'running') audioCtx.resume();
  heights.fill(0); peaks.fill(0);
  $('sys-status').textContent = 'SYS_ON';
  $('flash').classList.add('go');
  setTimeout(() => {
    overlay.classList.add('out');
    chassis.classList.remove('off'); chassis.classList.add('on');
    isInitialized = true;
    resizeAll();
    lastT = performance.now();
    requestAnimationFrame(animate);
    setTimeout(() => { overlay.style.display = 'none'; }, 500);
  }, 180);
}

/* ---------- start: microphone permission, then the 7-second boot ---------- */
async function startAnalyzer(event) {
  if (event) event.preventDefault();
  if (isInitialized || isBooting) return;
  isBooting = true;
  $('start-prompt').textContent = '[ requesting microphone access ]';
  $('sys-status').textContent = 'SYS_WAIT';
  $('status-line').textContent = 'AWAITING_MIC_ACCESS';

  try {
    // Microphone capture requires HTTPS (GitHub Pages provides this) or localhost.
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('SECURE_CONTEXT_REQUIRED');
    }
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) throw new Error('AUDIO_CONTEXT_UNSUPPORTED');

    // Construct and resume the audio context directly inside the user's tap.
    if (audioCtx && audioCtx.state !== 'closed') {
      try { await audioCtx.close(); } catch (closeError) { console.warn(closeError); }
    }
    audioCtx = new AudioContextClass({ latencyHint: 'interactive' });
    await audioCtx.resume();

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        autoGainControl: false,
        noiseSuppression: false
      },
      video: false
    });
    micStream = stream;

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0;
    analyser.minDecibels = -88;
    analyser.maxDecibels = -22;

    const source = audioCtx.createMediaStreamSource(stream);
    const silentOutput = audioCtx.createGain();
    silentOutput.gain.value = 0;
    source.connect(analyser);
    analyser.connect(silentOutput);
    silentOutput.connect(audioCtx.destination);

    await audioCtx.resume();
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    waveformArray = new Uint8Array(analyser.fftSize);
    const binHz = audioCtx.sampleRate / analyser.fftSize;
    binRanges = FREQ_BOUNDS.map(([lo, hi]) => {
      const firstBin = Math.max(1, Math.floor(lo / binHz));
      const lastBin = Math.min(Math.max(firstBin, Math.ceil(hi / binHz)), dataArray.length - 1);
      return [firstBin, lastBin];
    });
    micReady = true;
  } catch (err) {
    console.error('Voyager microphone initialization failed:', err);
    if (micStream) {
      micStream.getTracks().forEach(track => track.stop());
      micStream = null;
    }
    if (audioCtx && audioCtx.state !== 'closed') {
      try { await audioCtx.close(); } catch (closeError) { console.warn(closeError); }
    }
    audioCtx = null;
    isBooting = false;

    let message = 'MIC ACCESS FAILED — TAP TO RETRY';
    let status = 'CHECK MIC PERMISSIONS';
    if (err && err.message === 'SECURE_CONTEXT_REQUIRED') {
      message = '[ open this page over HTTPS ]';
      status = 'HTTPS REQUIRED';
    } else if (err && err.message === 'AUDIO_CONTEXT_UNSUPPORTED') {
      message = '[ browser audio is unsupported ]';
      status = 'AUDIO UNSUPPORTED';
    } else if (err && err.name === 'NotFoundError') {
      message = '[ no microphone was found ]';
      status = 'MICROPHONE NOT FOUND';
    } else if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')) {
      message = '[ allow microphone in browser settings, then tap ]';
      status = 'MICROPHONE BLOCKED';
    }
    $('start-prompt').textContent = message;
    $('sys-status').textContent = 'SYS_OFF';
    $('status-line').textContent = status;
    return;
  }

  // Permission is granted: only now does the visual boot sequence begin.
  $('start-prompt').style.display = 'none';
  overlay.classList.add('booting', 'overlay-booting');
  document.body.classList.add('overlay-booting');
  $('sys-status').textContent = 'SYS_BOOT';
  resizeAll();
  bootRAF = requestAnimationFrame(bootFrame(performance.now()));
}

overlay.addEventListener('click', startAnalyzer);

// any touch can wake a suspended/interrupted context (phone call, app switch, etc.)
document.addEventListener('pointerdown', () => { if (audioCtx && audioCtx.state !== 'running') audioCtx.resume(); });

/* ---------- live analyzer ---------- */
let lastT = 0;
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (audioCtx.state !== 'running') audioCtx.resume();
  analyser.getByteFrequencyData(dataArray);
  analyser.getByteTimeDomainData(waveformArray);

  const maxH = Math.max(12, canvas._h * .48);
  // Bass meter follows the average energy in the lowest usable frequency bins.
  const bassEnd = Math.max(2, Math.min(dataArray.length - 1, Math.ceil(180 / (audioCtx.sampleRate / analyser.fftSize))));
  let bassSum = 0;
  for (let j = 1; j <= bassEnd; j++) bassSum += dataArray[j];
  const bassRaw = bassSum / bassEnd;
  const bassLevel = clamp(Math.pow(bassRaw / 145, 0.9));
  for (let i = 0; i < BARS; i++) {
    const [lo, hi] = binRanges[i];
    let sum = 0, mx = 0;
    for (let j = lo; j <= hi; j++) { const v = dataArray[j]; sum += v; if (v > mx) mx = v; }
    // blend of average and max: punchier and more reactive than average alone
    const raw = 0.5 * (sum / (hi - lo + 1)) + 0.5 * mx;
    let target = Math.pow(Math.min(255, raw * (1 + i * 0.08)) / 255, 1.15) * maxH;

    // transient emphasis: sudden rises overshoot a bit so hits feel instant
    const flux = Math.max(0, target - prevTarget[i]);
    prevTarget[i] = target;
    target = Math.min(maxH, target + flux * 0.45);

    // instant attack, time-based decay (consistent on 60 / 120 Hz screens)
    if (target > heights[i]) heights[i] = target;
    else heights[i] = Math.max(0, heights[i] - (260 + (heights[i] - target) * 6) * dt);

    if (heights[i] >= peaks[i]) { peaks[i] = heights[i]; peakTimers[i] = 0.13; }
    else if (peakTimers[i] > 0) peakTimers[i] -= dt;
    else peaks[i] = Math.max(0, peaks[i] - 90 * dt);
  }
  drawBars(canvas, ctx, heights, peaks, waveformArray, bassLevel, true);
}

<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body,html{width:100vw;height:100vh;height:100dvh;background:#050611;font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;overflow:hidden;display:flex;justify-content:center;align-items:center}
.vfd-container{width:100vw;height:100vh;height:100dvh;background:radial-gradient(circle at center,#121326 0%,#090b18 85%,#050611 100%);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;gap:8px;
padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.chassis-screw{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#3a3237 0%,#151214 90%);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 2px rgba(0,0,0,.8);z-index:30}
.chassis-screw::after{content:"";position:absolute;top:3px;left:1px;width:6px;height:1px;background:rgba(0,0,0,.8)}
.screw-tl{top:6px;left:6px}.screw-tr{top:6px;right:6px}.screw-bl{bottom:6px;left:6px}.screw-br{bottom:6px;right:6px}
.vfd-container::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.45) 50%),radial-gradient(circle,rgba(105,190,213,.025) 1px,transparent 1px);background-size:100% 3px,4px 4px;z-index:40;pointer-events:none;opacity:.85}
.vfd-header{height:34px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:4}
.faceplate-bay{background:#080709;border:1px solid rgba(103,113,157,.25);border-top-color:rgba(0,0,0,.85);border-left-color:rgba(0,0,0,.85);border-radius:3px;box-shadow:inset 0 1px 4px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.03);display:flex;align-items:center;padding:0 10px}
.name-bay{height:100%;flex:0 1 auto;gap:8px}

#visCanvas{position:absolute;top:0;left:0;width:100%;height:100%}
.freq-legend{position:absolute;bottom:2px;left:8px;right:8px;display:flex;justify-content:space-between;font-family:monospace;font-size:6.5px;color:rgba(112,139,178,.65);pointer-events:none;z-index:3;letter-spacing:.5px}

/* Power-on flicker for the main faceplate */
.vfd-container.off .vfd-header .faceplate-bay,.vfd-container.off .vis-container{opacity:0}
@keyframes flick{0%{opacity:0}8%{opacity:.9}14%{opacity:.1}26%{opacity:1}34%{opacity:.35}46%{opacity:1}100%{opacity:1}}
.vfd-container.on .vfd-header .faceplate-bay{animation:flick .7s both}

/* Boot overlay */
#overlay{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,#120d10 0%,#07050a 55%,#020203 100%);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;align-items:center;z-index:20;cursor:pointer;
padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
transition:opacity .45s ease,transform .45s ease}
#overlay.out{opacity:0;transform:scale(1.05);pointer-events:none}
#overlay::after{content:"";position:absolute;left:0;right:0;height:2px;top:-4px;background:linear-gradient(90deg,transparent,rgba(238,134,149,.7),transparent);box-shadow:0 0 14px rgba(238,134,149,.6);opacity:0}
#overlay.booting::after{opacity:1;animation:sweep 2.4s linear infinite}

@keyframes flashgo{0%{opacity:.85}100%{opacity:0}}
.center-branding{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;width:100%;max-width:520px;min-height:0}
.exact-logo-frame{width:80%;max-width:400px;display:flex;justify-content:center;margin-bottom:8px;filter:drop-shadow(0 0 16px rgba(238,134,149,.25))}

.brand-title-group{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:4px}
.brand-main-title{font-size:14px;font-weight:700;letter-spacing:5px;color:#d99ab9;text-transform:uppercase;text-shadow:0 0 10px rgba(238,134,149,.4)}
.brand-sub-title{font-size:9px;font-weight:500;letter-spacing:4px;color:#83b7c7;text-transform:uppercase}
.brand-copyright{font-size:8px;letter-spacing:2px;color:rgba(207,120,98,.5);font-family:monospace;margin-top:8px}
.start-prompt{margin-top:16px;font-size:9px;letter-spacing:2.5px;color:rgba(238,134,149,.7);text-transform:uppercase;animation:pulse-glow 2s infinite ease-in-out}
@keyframes pulse-glow{0%,100%{opacity:.35}50%{opacity:.95}}
.boot-stage{width:100%;margin-top:12px;display:none}
.overlay-booting .boot-stage{display:block}
#gaugeCanvas{width:100%;height:96px;display:block;margin-bottom:6px}
#bootCanvas{width:100%;height:50px;display:block;background:#080709;border:1px solid rgba(103,113,157,.25);border-radius:3px;box-shadow:inset 0 1px 4px rgba(0,0,0,.9)}
#bootLog{margin-top:8px;font-family:monospace;font-size:8px;letter-spacing:1px;line-height:1.55;color:rgba(207,120,98,.8);text-align:left;white-space:pre;height:calc(8px*1.55*6);overflow:hidden;padding:0 4px}
.status-bar-container{width:100%;max-width:520px;background:rgba(12,10,13,.95);border:1px solid rgba(103,113,157,.3);border-radius:4px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 1px 4px rgba(0,0,0,.9),0 2px 12px rgba(0,0,0,.6)}
.status-readouts{display:flex;justify-content:space-between;align-items:center;font-family:monospace;font-size:8.5px;letter-spacing:1.5px;color:rgba(207,120,98,.85);text-transform:uppercase}
.status-readouts span{display:flex;align-items:center;gap:6px}
.status-indicator{width:5px;height:5px;border-radius:50%;background:#d99ab9;box-shadow:0 0 6px #d99ab9}

.boot-progress-bar{width:100%;height:5px;background:rgba(45,26,38,.7);border:1px solid rgba(103,113,157,.25);border-radius:2px;overflow:hidden}
.boot-progress-fill{width:0%;height:100%;background:linear-gradient(90deg,#30334f,#51466e 40%,#83b7c7 75%,#d99ab9);box-shadow:0 0 10px rgba(238,134,149,.8)}
#streak{position:absolute;top:22%;left:-30%;width:30%;height:90px;background:linear-gradient(90deg,transparent,rgba(232,200,154,.16) 45%,rgba(255,236,210,.5) 50%,rgba(232,200,154,.16) 55%,transparent);filter:blur(7px);opacity:0;pointer-events:none;z-index:24;mix-blend-mode:screen}
#welcome{margin-top:8px;font-size:9px;letter-spacing:9px;color:#a8c5d1;text-transform:uppercase;opacity:0;text-shadow:0 0 12px rgba(232,200,154,.55);padding-left:9px}

<body>
<div class="vfd-container off" id="chassis">
  <div class="chassis-screw screw-tl"></div><div class="chassis-screw screw-tr"></div>
  <div class="chassis-screw screw-bl"></div><div class="chassis-screw screw-br"></div>

  <div id="overlay">
    <div id="flash"></div><div id="streak"></div>
    <div class="center-branding">
      <div class="exact-logo-frame" id="logoFrame"><img src="logo.png" alt="Voyager Audio Works Logo"></div>
      <div class="brand-title-group">
        <div class="brand-main-title">Voyager</div>
        <div class="brand-sub-title">Audio Works</div>
      </div>
      <div class="brand-copyright">MODEL VAW-80 // FREQUENCY SPECTRUM ANALYZER</div>
      <div class="start-prompt" id="start-prompt">[ tap screen to initialize ]</div>
      <div class="boot-stage">
        <canvas id="gaugeCanvas"></canvas>
        <canvas id="bootCanvas"></canvas>

      </div>
    </div>
    <div class="status-bar-container">
      <div class="status-readouts">
        <span><i class="status-indicator"></i><span id="sys-status">SYS_OFF</span></span>

    </div>
  </div>

  <div class="vfd-header">
    <div class="faceplate-bay name-bay"><div class="status-led"></div><div class="device-name">Voyager Audio Works</div></div>
    <div class="faceplate-bay header-vent-bay">
      <div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div>
      <div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div><div class="vent-slat"></div>
    </div>
    <div class="faceplate-bay clock-bay"><div class="time-display" id="time-display">00:00:00</div></div>
  </div>

  <div class="vis-container faceplate-bay">
    <canvas id="visCanvas"></canvas>
    <div class="freq-legend">
      <span>30Hz</span><span>60</span><span>120</span><span>250</span><span>500</span><span>1k</span><span>2k</span><span>4k</span><span>8k</span><span>16kHz</span>
    </div>

</div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('visCanvas'), ctx = canvas.getContext('2d');
const bootCanvas = $('bootCanvas'), bctx = bootCanvas.getContext('2d');
const gaugeCanvas = $('gaugeCanvas'), gctx = gaugeCanvas.getContext('2d');
const overlay = $('overlay'), chassis = $('chassis'), logoFrame = $('logoFrame');

setInterval(() => { $('time-display').textContent = new Date().toTimeString().split(' ')[0]; }, 1000);

const BARS = 24;
// Logarithmic bands preserve useful low-frequency detail while spreading the highs.
const FREQ_BOUNDS = Array.from({length:BARS}, (_, i) => {
  const minHz = 30, maxHz = 16000;
  const lo = minHz * Math.pow(maxHz / minHz, i / BARS);
  const hi = minHz * Math.pow(maxHz / minHz, (i + 1) / BARS);
  return [lo, hi];
});
const COLORS = ['#34304f','#51416d','#72527f','#94617f','#bd7188','#d59a9b'];
const BLOCK_H = 3, BLOCK_GAP = 1.7, STEP = BLOCK_H + BLOCK_GAP;

let audioCtx, analyser, dataArray, waveformArray, binRanges;
let isInitialized = false, isBooting = false, micReady = false, bootRAF = 0, micStream = null;

const heights = new Float32Array(BARS), peaks = new Float32Array(BARS), peakTimers = new Float32Array(BARS), prevTarget = new Float32Array(BARS);

/* ---------- canvas helpers (retina-aware) ---------- */
function setupCanvas(c, cx) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c._w = c.clientWidth; c._h = c.clientHeight;
  c.width = Math.round(c._w * dpr); c.height = Math.round(c._h * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function resizeAll() { setupCanvas(canvas, ctx); setupCanvas(bootCanvas, bctx); setupCanvas(gaugeCanvas, gctx); }
window.addEventListener('resize', resizeAll);

/* Shared renderer: segmented spectrum + restrained Lissajous display.
   No per-segment shadowBlur; paths are batched to stay smooth on mobile. */
function drawBars(c, cx, hts, pks, waveform = null, clock = 0) {
  const w = c._w, h = c._h;
  cx.clearRect(0, 0, w, h);

  // Dark glass, subtle horizontal calibration lines and a faint central axis.
  const bg = cx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, 'rgba(12,13,27,.96)');
  bg.addColorStop(.55, 'rgba(13,10,24,.94)');
  bg.addColorStop(1, 'rgba(5,7,15,.98)');
  cx.fillStyle = bg; cx.fillRect(0, 0, w, h);

  const oscH = Math.max(48, h * .34);
  const oscTop = 7, oscBottom = oscTop + oscH;
  const midX = w / 2, midY = oscTop + oscH / 2;
  cx.strokeStyle = 'rgba(113,119,170,.12)';
  cx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    const y = oscTop + (oscH * i / 5);
    cx.beginPath(); cx.moveTo(8, y); cx.lineTo(w - 8, y); cx.stroke();
  }
  cx.setLineDash([2, 5]);
  cx.beginPath(); cx.moveTo(midX, oscTop); cx.lineTo(midX, oscBottom); cx.stroke();
  cx.setLineDash([]);

  // Lissajous figure: microphone samples drive X and a phase-shifted sample drives Y.
  // A slow phase drift adds movement even when the incoming signal is steady.
  const trace = new Path2D();
  const samples = waveform ? waveform.length : 256;
  const radiusX = Math.min(w * .31, 190);
  const radiusY = oscH * .39;
  const phase = clock * .00032;
  const points = Math.min(samples, 512);
  for (let i = 0; i < points; i++) {
    let x, y;
    if (waveform) {
      const a = (waveform[i] - 128) / 128;
      const j = (i + Math.floor(points * .23)) % points;
      const b = (waveform[j] - 128) / 128;
      x = a;
      y = b * .88 + Math.sin(i / points * Math.PI * 2 + phase) * .08;
    } else {
      const a = i / points * Math.PI * 2;
      x = Math.sin(3 * a + phase);
      y = Math.sin(4 * a);
    }
    const px = midX + x * radiusX;
    const py = midY + y * radiusY;
    if (i === 0) trace.moveTo(px, py); else trace.lineTo(px, py);
  }
  cx.save();
  cx.beginPath(); cx.rect(6, oscTop, w - 12, oscH); cx.clip();
  cx.strokeStyle = 'rgba(95,210,220,.13)';
  cx.lineWidth = 5; cx.stroke(trace);
  cx.strokeStyle = 'rgba(124,194,213,.76)';
  cx.lineWidth = 1.15; cx.stroke(trace);
  cx.strokeStyle = 'rgba(224,151,184,.42)';
  cx.lineWidth = .65;
  cx.translate(.8, -.5); cx.stroke(trace);
  cx.restore();

  // Oscillator frame and tiny instrument labels.
  cx.strokeStyle = 'rgba(115,126,175,.22)';
  cx.strokeRect(7.5, oscTop + .5, w - 15, oscH - 1);
  cx.font = '6px monospace';
  cx.fillStyle = 'rgba(147,164,194,.52)';
  cx.textAlign = 'left';
  cx.fillText('XY / LISSAJOUS', 12, oscTop + 9);
  cx.textAlign = 'right';
  cx.fillText('PHASE ' + (Math.round((phase % (Math.PI * 2)) * 57.3)).toString().padStart(3,'0'), w - 12, oscTop + 9);

  // Spectrum occupies the lower portion, leaving the oscillator readable.
  const padX = 8, avail = w - padX * 2;
  const gap = Math.max(1, Math.floor(avail * .006));
  const bw = Math.max(2, (avail - gap * (BARS - 1)) / BARS);
  const baseY = h - 12;
  const spectrumTop = oscBottom + 9;
  const maxH = Math.max(12, baseY - spectrumTop);
  const maxSeg = Math.max(1, Math.floor(maxH / STEP));

  const ghost = new Path2D();
  const paths = COLORS.map(() => new Path2D());
  const glow = new Path2D(), caps = new Path2D();
  let x = padX;
  for (let i = 0; i < BARS; i++) {
    for (let s = 0; s < maxSeg; s++) ghost.rect(x, baseY - s * STEP, bw, BLOCK_H);
    const active = Math.min(maxSeg, Math.floor(hts[i] / STEP));
    for (let s = 0; s < active; s++) {
      const r = s / maxSeg;
      const ci = r < .25 ? 0 : r < .43 ? 1 : r < .60 ? 2 : r < .75 ? 3 : r < .89 ? 4 : 5;
      paths[ci].rect(x, baseY - s * STEP, bw, BLOCK_H);
    }
    if (active > 0) {
      const ty = baseY - (active - 1) * STEP;
      glow.rect(x - 1, ty - 2, bw + 2, BLOCK_H + 4);
    }
    if (pks[i] > 2) caps.rect(x, baseY - Math.min(maxH, pks[i]), bw, 1.5);
    x += bw + gap;
  }
  cx.fillStyle = 'rgba(74,74,112,.17)'; cx.fill(ghost);
  cx.fillStyle = 'rgba(103,185,205,.10)'; cx.fill(glow);
  COLORS.forEach((col, i) => { cx.fillStyle = col; cx.fill(paths[i]); });
  cx.fillStyle = '#d6a2bd'; cx.fill(caps);

  // Fine baseline and restrained frequency ticks.
  cx.fillStyle = 'rgba(132,148,183,.38)';
  cx.fillRect(padX, baseY + 3, avail, 1);
  for (let i = 0; i < 12; i++) {
    const tx = padX + avail * i / 11;
    cx.fillRect(tx, baseY + 4, 1, i % 3 === 0 ? 4 : 2);
  }
}

/* ---------- boot sequence: night-noir VIP sedan welcome (7s) ---------- */
const DUR = 7000;
const LOG = [
  [300,  'VAW-80 FIRMWARE 2.4',    'OK'],
  [1100, 'MIC BUS HANDSHAKE',      'LOCK'],
  [1900, 'ANALOG STAGE WARM-UP',   'OK'],
  [2800, 'CABIN ACOUSTIC PROFILE', 'FLAT'],
  [3800, '2048-PT FFT / 24 BAND',  'OK'],
  [4800, 'VFD SEGMENT TEST',       'RUN'],
  [5900, 'ALL SYSTEMS',            'NOMINAL']
];
const STAGES = [[0,'COLD_START'],[15,'WARMING_TUBES'],[30,'GAUGE_SELF_CHECK'],[55,'SIGNAL_PATH_OK'],[78,'SEGMENT_TEST'],[93,'ALL_SYSTEMS_GO'],[100,'SYSTEM_ONLINE']];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = x => x * x * (3 - 2 * x);

// Optitron-style gauge: ticks weld on one by one, needle sweeps to redline, then settles
function drawGauge(t) {
  const w = gaugeCanvas._w, h = gaugeCanvas._h, g = gctx;
  g.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h - 8, R = Math.min(h - 14, w * 0.36), N = 31;
  const lit = clamp((t - 900) / 1100) * N;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '7px monospace';
  for (let i = 0; i < N; i++) {
    const f = i / (N - 1), a = Math.PI + f * Math.PI, major = i % 5 === 0;
    const col = f > .85 ? '#d99ab9' : f > .7 ? '#83b7c7' : '#a8c5d1';
    const on = i < lit;
    const cos = Math.cos(a), sin = Math.sin(a), r1 = R - (major ? 11 : 6);
    g.strokeStyle = on ? col : 'rgba(119,58,77,.22)';
    g.lineWidth = major ? 2 : 1;
    g.shadowColor = col; g.shadowBlur = on ? 6 : 0;
    g.beginPath(); g.moveTo(cx + cos * r1, cy + sin * r1); g.lineTo(cx + cos * R, cy + sin * R); g.stroke();
    if (major && on) { g.shadowBlur = 0; g.fillStyle = 'rgba(232,200,154,.7)'; g.fillText(i / 5, cx + cos * (R - 20), cy + sin * (R - 20)); }
  }
  if (t > 800) {
    let v;
    if (t < 2000) v = 0;
    else if (t < 3300) v = 1 - Math.pow(1 - (t - 2000) / 1300, 3);
    else if (t < 4400) v = 1 - 0.86 * smooth((t - 3300) / 1100);
    else v = 0.14 + 0.012 * Math.sin(t * 0.012);
    const a = Math.PI + v * Math.PI, cos = Math.cos(a), sin = Math.sin(a);
    g.strokeStyle = '#d99ab9'; g.shadowColor = '#d99ab9'; g.shadowBlur = 8; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx + cos * 8, cy + sin * 8); g.lineTo(cx + cos * (R - 3), cy + sin * (R - 3)); g.stroke();
    g.fillStyle = '#a8c5d1'; g.shadowColor = '#a8c5d1'; g.beginPath(); g.arc(cx, cy, 3, 0, 7); g.fill();
  }
  g.shadowBlur = 0;
}

function bootFrame(t0) {
  return function loop(now) {
    const t = now - t0;
    bootRAF = requestAnimationFrame(loop);

    // logo: power-cycle dip, then slow fade up and a breathing champagne glow
    logoFrame.style.opacity = t < 300 ? 1 - 0.95 * (t / 300) : 0.05 + 0.95 * smooth(clamp((t - 300) / 1500));
    const br = 0.5 + 0.5 * Math.sin(t * 0.004);
    logoFrame.style.filter = `drop-shadow(0 0 ${12 + 14 * br}px rgba(232,200,154,${0.12 + 0.14 * br}))`;

    // headlight streaks sweep across the screen twice
    const s1 = (t - 500) / 1300, s2 = (t - 5700) / 1000;
    const p = s1 >= 0 && s1 <= 1 ? s1 : s2 >= 0 && s2 <= 1 ? s2 : -1;
    $('streak').style.opacity = p < 0 ? 0 : 1;
    if (p >= 0) $('streak').style.left = (p * 150 - 30) + '%';

    // terminal log (last 6 lines), typed out
    const lines = [];
    for (const [at, label, status] of LOG) {
      if (t < at) break;
      lines.push('> ' + (label.padEnd(26, '.') + ' ' + status).slice(0, Math.floor((t - at) / 16)));
    }
    if (lines.length && Math.floor(t / 300) % 2) lines[lines.length - 1] += '_';
    $('bootLog').textContent = lines.slice(-6).join('\n');

    drawGauge(t);

    // lamp-test bars: wave, left-to-right sweep, staggered drop
    const maxH = bootCanvas._h - 18;
    for (let i = 0; i < BARS; i++) {
      let f = 0;
      if (t > 3000 && t < 5000) f = (0.5 + 0.5 * Math.sin((t - 3000) * 0.006 - i * 0.55)) * clamp((t - 3000) / 600) * 0.85;
      else if (t >= 5000 && t < 5900) f = clamp(((t - 5000) / 900) * (BARS + 3) - i);
      else if (t >= 5900) f = clamp(1 - (t - 5900 - i * 30) / 420);
      heights[i] = f * maxH; peaks[i] = f * maxH;
    }
    drawBars(bootCanvas, bctx, heights, peaks);

    $('welcome').style.opacity = clamp((t - 5900) / 700);

    const pct = Math.floor(smooth(clamp(t / DUR)) * 100);
    $('progress-fill').style.width = pct + '%';
    $('pct-display').textContent = String(pct).padStart(2, '0') + '%';
    let st = STAGES[0][1]; for (const [q, txt] of STAGES) if (pct >= q) st = txt;
    $('status-line').textContent = st;

    if (t >= DUR) { cancelAnimationFrame(bootRAF); finishBoot(); }
  };
}

function finishBoot() {
  if (audioCtx.state !== 'running') audioCtx.resume();
  heights.fill(0); peaks.fill(0);
  $('sys-status').textContent = 'SYS_ON';
  $('flash').classList.add('go');
  setTimeout(() => {
    overlay.classList.add('out');
    chassis.classList.remove('off'); chassis.classList.add('on');
    isInitialized = true;
    resizeAll();
    lastT = performance.now();
    requestAnimationFrame(animate);
    setTimeout(() => { overlay.style.display = 'none'; }, 500);
  }, 180);
}

/* ---------- start: ask for the mic FIRST, boot only once it's granted ---------- */
overlay.addEventListener('click', async () => {
  if (isInitialized || isBooting) return;
  isBooting = true;
  $('start-prompt').textContent = '[ allow microphone access ]';
  $('sys-status').textContent = 'SYS_WAIT';
  $('status-line').textContent = 'AWAITING_MIC_ACCESS';

  // created inside the tap so iOS lets it run; 'interactive' = smallest buffer
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  audioCtx.resume();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false, latency: 0 },
      video: false
    });
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0;
    analyser.minDecibels = -88; analyser.maxDecibels = -22;
    micStream = stream;                       // keep a reference so iOS doesn't drop the tracks
    const src = audioCtx.createMediaStreamSource(stream);
    const mute = audioCtx.createGain(); mute.gain.value = 0;
    src.connect(analyser);
    analyser.connect(mute); mute.connect(audioCtx.destination);   // Safari only processes a graph that reaches an output
    await audioCtx.resume();                  // the permission prompt can leave the context suspended
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    waveformArray = new Uint8Array(analyser.fftSize);
    const binHz = audioCtx.sampleRate / analyser.fftSize;
    binRanges = FREQ_BOUNDS.map(([lo, hi]) => {
      const a = Math.max(1, Math.floor(lo / binHz));
      return [a, Math.min(Math.max(a, Math.ceil(hi / binHz)), dataArray.length - 1)];
    });
    micReady = true;
  } catch (err) {
    alert('Microphone permission is required to analyze audio.');
    console.error(err);
    isBooting = false;
    $('start-prompt').textContent = '[ tap screen to initialize ]';
    $('sys-status').textContent = 'SYS_OFF'; $('status-line').textContent = 'READY TO INITIALIZE';
    return;
  }

  // permission granted: now the show starts
  $('start-prompt').style.display = 'none';
  overlay.classList.add('booting', 'overlay-booting');
  document.body.classList.add('overlay-booting');
  $('sys-status').textContent = 'SYS_BOOT';
  resizeAll();   // canvases only have a size once the boot stage is visible
  bootRAF = requestAnimationFrame(bootFrame(performance.now()));
});

// any touch can wake a suspended/interrupted context (phone call, app switch, etc.)
document.addEventListener('pointerdown', () => { if (audioCtx && audioCtx.state !== 'running') audioCtx.resume(); });

/* ---------- live analyzer ---------- */
let lastT = 0;
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (audioCtx.state !== 'running') audioCtx.resume();
  analyser.getByteFrequencyData(dataArray);
  analyser.getByteTimeDomainData(waveformArray);

  const maxH = canvas._h - 18;
  for (let i = 0; i < BARS; i++) {
    const [lo, hi] = binRanges[i];
    let sum = 0, mx = 0;
    for (let j = lo; j <= hi; j++) { const v = dataArray[j]; sum += v; if (v > mx) mx = v; }
    // blend of average and max: punchier and more reactive than average alone
    const raw = 0.5 * (sum / (hi - lo + 1)) + 0.5 * mx;
    let target = Math.pow(Math.min(255, raw * (1 + i * 0.08)) / 255, 1.15) * maxH;

    // transient emphasis: sudden rises overshoot a bit so hits feel instant
    const flux = Math.max(0, target - prevTarget[i]);
    prevTarget[i] = target;
    target = Math.min(maxH, target + flux * 0.45);

    // instant attack, time-based decay (consistent on 60 / 120 Hz screens)
    if (target > heights[i]) heights[i] = target;
    else heights[i] = Math.max(0, heights[i] - (260 + (heights[i] - target) * 6) * dt);

    if (heights[i] >= peaks[i]) { peaks[i] = heights[i]; peakTimers[i] = 0.13; }
    else if (peakTimers[i] > 0) peakTimers[i] -= dt;
    else peaks[i] = Math.max(0, peaks[i] - 90 * dt);
  }
  drawBars(canvas, ctx, heights, peaks, waveformArray, now);
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHELGARD SYNC // 12-BAND ANALYZER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background-color: #030305;
            font-family: -apple-system, "SF Pro Text", "Consolas", monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Outer Frame / Bezel Enclosure */
        .cyber-bezel {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #0a0b10 0%, #030305 100%);
            border: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.95);
        }

        /* Subtle Luxury Scanline Overlay */
        .cyber-bezel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 3px;
            z-index: 6;
            pointer-events: none;
            opacity: 0.7;
        }

        /* Micro Corner Reticles / Corporate Branding Details */
        .corner-tag {
            position: absolute;
            font-size: 8px;
            letter-spacing: 1.5px;
            color: rgba(212, 175, 55, 0.4);
            z-index: 5;
            text-transform: uppercase;
        }
        .tag-tl { top: 8px; left: 12px; }
        .tag-tr { top: 8px; right: 12px; }
        .tag-bl { bottom: 8px; left: 12px; }
        .tag-br { bottom: 8px; right: 12px; }

        /* Corporate HUD Header */
        .hud-header {
            height: 38px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            margin-top: 12px;
            color: #d4af37; /* Champagne Gold */
            font-size: 10px;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.12);
            z-index: 4;
        }

        .corp-logo {
            font-weight: 700;
            letter-spacing: 3px;
            color: #f7e7a1;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .corp-logo::before {
            content: "◆";
            font-size: 8px;
            color: #a855f7;
        }

        .hud-metrics {
            display: flex;
            gap: 16px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 9px;
        }

        /* Canvas & Visualizer Container */
        .vis-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 8px 16px 8px 16px;
            z-index: 2;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* HUD Footer */
        .hud-footer {
            height: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 8px;
            letter-spacing: 1.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 4;
        }

        /* Luxury Tap Overlay */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 5, 0.94);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #d4af37;
            z-index: 20;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 4px;
            margin-bottom: 8px;
            color: #f7e7a1;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
        }
        #overlay p {
            font-size: 9px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="cyber-bezel">
        <!-- Structural Corner Markings -->
        <div class="corner-tag tag-tl">SYS//06S</div>
        <div class="corner-tag tag-tr">LXS-800</div>
        <div class="corner-tag tag-bl">SEC//OK</div>
        <div class="corner-tag tag-br">AETH.CORP</div>

        <!-- Initializer Screen -->
        <div id="overlay">
            <h1>AETHELGARD AUDIO ANALYZER</h1>
            <p>[ TAP SCREEN TO ENGAGE SYNC ]</p>
        </div>

        <!-- Corporate Top Header -->
        <div class="hud-header">
            <div class="corp-logo">AETHELGARD // LX-12</div>
            <div class="hud-metrics">
                <span>FREQ: 20Hz - 20kHz</span>
                <span id="time-display">00:00:00</span>
            </div>
        </div>

        <!-- Spectrum Visualizer Viewport -->
        <div class="vis-container">
            <canvas id="visCanvas"></canvas>
        </div>

        <!-- Bottom Status Bar -->
        <div class="hud-footer">
            <span>MIC_INPUT: ACTIVE</span>
            <span>DECAY: GRAVITY_SMOOTH</span>
            <span>GAIN: DYNAMIC</span>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('visCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const timeEl = document.getElementById('time-display');

        // Clock Update
        setInterval(() => {
            const now = new Date();
            timeEl.textContent = now.toTimeString().split(' ')[0];
        }, 1000);

        let audioCtx, analyser, microphone, dataArray;
        let isInitialized = false;

        const BARS_COUNT = 12;
        let currentHeights = new Array(BARS_COUNT).fill(0);
        let peakHeights = new Array(BARS_COUNT).fill(0);
        let peakHoldTimers = new Array(BARS_COUNT).fill(0);

        // Custom frequency ranges (Hz) optimized for music & phone microphone response
        const FREQ_BOUNDS = [
            [30, 80],      // 1: Sub Bass
            [80, 180],     // 2: Bass / Kick
            [180, 320],    // 3: Upper Bass / Warmth
            [320, 600],    // 4: Low Mids / Vocals
            [600, 1000],   // 5: Midrange
            [1000, 1800],  // 6: Upper Mids / Guitars
            [1800, 2800],  // 7: Presence / Vocal clarity
            [2800, 4200],  // 8: High Mids / Snare attack
            [4200, 6000],  // 9: Treble
            [6000, 8500],  // 10: High Treble / Cymbals
            [8500, 12000], // 11: Air
            [12000, 16000] // 12: Top End
        ];

        overlay.addEventListener('click', async () => {
            if (isInitialized) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                analyser = audioCtx.createAnalyser();
                microphone = audioCtx.createMediaStreamSource(stream);
                
                // Increased FFT size to 512 for higher frequency resolution in low end
                analyser.fftSize = 512; 
                analyser.smoothingTimeConstant = 0.5;
                microphone.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                isInitialized = true;
                overlay.style.display = 'none';
                
                resizeCanvas();
                animate();
            } catch (err) {
                alert('Microphone access is required.');
                console.error(err);
            }
        });

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function animate() {
            requestAnimationFrame(animate);
            if (!isInitialized) return;

            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const paddingX = 24;
            const availableWidth = canvas.width - (paddingX * 2);
            const barGap = 10;
            const barWidth = Math.floor((availableWidth - (barGap * (BARS_COUNT - 1))) / BARS_COUNT);
            let x = paddingX;

            const maxHeight = canvas.height - 30;
            const nyquist = audioCtx.sampleRate / 2;

            for (let i = 0; i < BARS_COUNT; i++) {
                // Map custom Hz bounds to FFT dataArray indices
                const [lowHz, highHz] = FREQ_BOUNDS[i];
                const lowIndex = Math.floor((lowHz / nyquist) * dataArray.length);
                const highIndex = Math.min(
                    Math.ceil((highHz / nyquist) * dataArray.length), 
                    dataArray.length - 1
                );

                // Calculate average energy in this specific frequency band
                let sum = 0;
                let count = 0;
                for (let j = lowIndex; j <= highIndex; j++) {
                    sum += dataArray[j];
                    count++;
                }
                const rawValue = count > 0 ? sum / count : 0;

                // Frequency curve boost (high frequencies need slight artificial boost for mic sensitivity)
                const highBoost = 1 + (i * 0.12);
                const boostedValue = Math.min(255, rawValue * highBoost);

                const targetHeight = (boostedValue / 255) * maxHeight;

                // --- Smooth Bar Decay Physics ---
                if (targetHeight > currentHeights[i]) {
                    currentHeights[i] = targetHeight;
                } else {
                    currentHeights[i] -= 2.8;
                    if (currentHeights[i] < 0) currentHeights[i] = 0;
                }

                // --- Peak Cap Decay Physics ---
                if (currentHeights[i] > peakHeights[i]) {
                    peakHeights[i] = currentHeights[i];
                    peakHoldTimers[i] = 12;
                } else {
                    if (peakHoldTimers[i] > 0) {
                        peakHoldTimers[i]--;
                    } else {
                        peakHeights[i] -= 1.2;
                        if (peakHeights[i] < 0) peakHeights[i] = 0;
                    }
                }

                const h = currentHeights[i];

                // Luxury Corporate Color Palette
                const gradient = ctx.createLinearGradient(0, canvas.height - 10, 0, canvas.height - 10 - maxHeight);
                gradient.addColorStop(0.0, 'rgba(212, 175, 55, 0.85)');
                gradient.addColorStop(0.55, 'rgba(168, 85, 247, 0.75)');
                gradient.addColorStop(1.0, 'rgba(56, 189, 248, 0.9)');

                ctx.fillStyle = gradient;

                // Draw Segmented Blocks
                const blockHeight = 4;
                const blockGap = 2;
                let currentY = canvas.height - 10;
                
                while (currentY > canvas.height - 10 - h) {
                    ctx.fillRect(x, currentY, barWidth, blockHeight);
                    currentY -= (blockHeight + blockGap);
                }

                // Floating Peak Line
                if (peakHeights[i] > 2) {
                    const peakY = canvas.height - 10 - peakHeights[i];
                    ctx.fillStyle = 'rgba(247, 231, 161, 0.95)';
                    ctx.fillRect(x, peakY, barWidth, 2);
                }

                x += barWidth + barGap;
            }
        }
    </script>

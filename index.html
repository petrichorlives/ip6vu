<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>aethelgard lx-12</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #080708;
            font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Enclosure Chassis Frame */
        .vfd-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at center, #161416 0%, #0d0c0e 85%, #070607 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            gap: 10px;
            padding-top: max(14px, env(safe-area-inset-top));
            padding-bottom: max(14px, env(safe-area-inset-bottom));
            padding-left: max(14px, env(safe-area-inset-left));
            padding-right: max(14px, env(safe-area-inset-right));
        }

        /* Scanline Mesh Overlay */
        .vfd-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.45) 50%),
                radial-gradient(circle, rgba(238, 134, 149, 0.02) 1px, transparent 1px);
            background-size: 100% 3px, 4px 4px;
            z-index: 6;
            pointer-events: none;
            opacity: 0.85;
        }

        /* Top Faceplate Modular Header Frame */
        .vfd-header {
            height: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            z-index: 4;
        }

        /* Recessed Modular Bays */
        .faceplate-bay {
            background: #09080a;
            border: 1px solid rgba(119, 58, 77, 0.22);
            border-top-color: rgba(0, 0, 0, 0.8);
            border-left-color: rgba(0, 0, 0, 0.8);
            border-radius: 3px;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            padding: 0 10px;
        }

        .name-bay {
            height: 100%;
            flex: 0 1 auto;
        }

        .clock-bay {
            height: 100%;
            flex: 0 0 auto;
        }

        .device-name {
            font-size: 9px;
            letter-spacing: 2px;
            color: rgba(238, 134, 149, 0.55);
            font-weight: 400;
            text-transform: lowercase;
        }

        .time-display {
            font-size: 9px;
            letter-spacing: 1.5px;
            color: rgba(207, 120, 98, 0.45);
            font-family: monospace;
        }

        /* Visualizer Main Bay Frame */
        .vis-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2;
            overflow: hidden;
            padding: 4px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* --- Minimal Broadcast Overlay --- */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a090b;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            cursor: pointer;
            padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        }

        .center-branding {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Glowing Vector Logo Mark */
        .logo-mark {
            width: 82px;
            height: 82px;
            margin-bottom: 22px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-mark svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 12px rgba(238, 134, 149, 0.45));
        }

        /* Lined Broadcast Style Nameplate */
        .brand-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #ee8695;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ee8695 0%, #cf7862 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(238, 134, 149, 0.3);
            margin-bottom: 4px;
            position: relative;
        }

        .brand-subtitle {
            font-size: 10px;
            letter-spacing: 5px;
            color: rgba(207, 120, 98, 0.7);
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .brand-copyright {
            font-size: 8px;
            letter-spacing: 1.5px;
            color: rgba(119, 58, 77, 0.6);
            font-family: monospace;
        }

        .start-prompt {
            margin-top: 24px;
            font-size: 9px;
            letter-spacing: 2px;
            color: rgba(238, 134, 149, 0.5);
            text-transform: uppercase;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* Bottom Readout Status Bar */
        .status-bar-container {
            width: 100%;
            background: rgba(15, 13, 16, 0.85);
            border: 1px solid rgba(119, 58, 77, 0.25);
            border-radius: 4px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .status-readouts {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 8px;
            letter-spacing: 1.5px;
            color: rgba(207, 120, 98, 0.75);
            text-transform: uppercase;
        }

        .status-readouts span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-indicator {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ee8695;
            box-shadow: 0 0 6px #ee8695;
        }

        .boot-progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(84, 50, 70, 0.3);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .boot-progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #773a4d 0%, #cf7862 70%, #ee8695 100%);
            box-shadow: 0 0 8px rgba(238, 134, 149, 0.6);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="vfd-container">

        <!-- Startup Screen Overlay -->
        <div id="overlay">
            <div class="center-branding">
                <!-- Globe Logo Mark -->
                <div class="logo-mark">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="44" stroke="#773a4d" stroke-width="1.5" stroke-dasharray="2 2" />
                        <ellipse cx="50" cy="50" rx="44" ry="18" stroke="#cf7862" stroke-width="1.5" />
                        <ellipse cx="50" cy="50" rx="44" ry="32" stroke="#ee8695" stroke-width="1.2" />
                        <ellipse cx="50" cy="50" rx="18" ry="44" stroke="#cf7862" stroke-width="1.5" />
                        <line x1="6" y1="50" x2="94" y2="50" stroke="#ee8695" stroke-width="1.5" />
                        <line x1="50" y1="6" x2="50" y2="94" stroke="#ee8695" stroke-width="1.5" />
                    </svg>
                </div>

                <div class="brand-title">aethelgard</div>
                <div class="brand-subtitle">lx-12 audio system</div>
                <div class="brand-copyright">© AETHELGARD DSP LABS 2026</div>

                <div class="start-prompt" id="start-prompt">[ tap screen to initialize ]</div>
            </div>

            <!-- Bottom Status Readout Bar -->
            <div class="status-bar-container">
                <div class="status-readouts">
                    <span><i class="status-indicator"></i><span id="sys-status">SYS_IDLE</span></span>
                    <span id="status-line">AWAITING INPUT</span>
                    <span id="pct-display">00%</span>
                </div>
                <div class="boot-progress-bar">
                    <div class="boot-progress-fill" id="progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- Visualizer Header -->
        <div class="vfd-header">
            <div class="faceplate-bay name-bay">
                <div class="device-name">aethelgard lx-12</div>
            </div>
            <div class="faceplate-bay clock-bay">
                <div class="time-display" id="time-display">00:00:00</div>
            </div>
        </div>

        <!-- Visualizer Canvas Bay -->
        <div class="vis-container faceplate-bay">
            <canvas id="visCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('visCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startPrompt = document.getElementById('start-prompt');
        const sysStatus = document.getElementById('sys-status');
        const statusLine = document.getElementById('status-line');
        const pctDisplay = document.getElementById('pct-display');
        const progressFill = document.getElementById('progress-fill');
        const timeEl = document.getElementById('time-display');

        setInterval(() => {
            const now = new Date();
            timeEl.textContent = now.toTimeString().split(' ')[0];
        }, 1000);

        let audioCtx, analyser, microphone, dataArray;
        let isInitialized = false;
        let isBooting = false;

        const BARS_COUNT = 12;
        let currentHeights = new Array(BARS_COUNT).fill(0);
        let peakHeights = new Array(BARS_COUNT).fill(0);
        let peakHoldTimers = new Array(BARS_COUNT).fill(0);

        const FREQ_BOUNDS = [
            [30, 80], [80, 180], [180, 320], [320, 600],
            [600, 1000], [1000, 1800], [1800, 2800], [2800, 4200],
            [4200, 6000], [6000, 8500], [8500, 12000], [12000, 16000]
        ];

        overlay.addEventListener('click', async () => {
            if (isInitialized || isBooting) return;
            isBooting = true;

            startPrompt.style.display = 'none';
            sysStatus.textContent = "SYS_BOOT";

            try {
                // Request microphone access
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        autoGainControl: false,
                        noiseSuppression: false
                    }, 
                    video: false 
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                microphone = audioCtx.createMediaStreamSource(stream);
                
                analyser.fftSize = 512; 
                analyser.smoothingTimeConstant = 0.2; 
                microphone.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                // Multi-stage status sequence
                const bootSteps = [
                    { pct: 20, text: "STREAM_INIT" },
                    { pct: 45, text: "CALIBRATING_DSP" },
                    { pct: 75, text: "GRID_SYNC_OK" },
                    { pct: 100, text: "SYSTEM_ONLINE" }
                ];

                let currentStep = 0;
                let progress = 0;

                const bootInterval = setInterval(() => {
                    progress += 1;
                    progressFill.style.width = `${progress}%`;
                    pctDisplay.textContent = `${String(progress).padStart(2, '0')}%`;

                    if (currentStep < bootSteps.length && progress >= bootSteps[currentStep].pct) {
                        statusLine.textContent = bootSteps[currentStep].text;
                        currentStep++;
                    }

                    if (progress >= 100) {
                        clearInterval(bootInterval);
                        setTimeout(finishInitialization, 300);
                    }
                }, 40);

            } catch (err) {
                alert('Microphone access is required to run the visualizer.');
                console.error(err);
                isBooting = false;
                startPrompt.style.display = 'block';
                sysStatus.textContent = "SYS_IDLE";
                statusLine.textContent = "AWAITING INPUT";
            }
        });

        function finishInitialization() {
            isInitialized = true;
            overlay.style.display = 'none';
            resizeCanvas();
            animate();
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function animate() {
            requestAnimationFrame(animate);
            if (!isInitialized) return;

            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const paddingX = 8;
            const availableWidth = canvas.width - (paddingX * 2);
            const barGap = Math.max(3, Math.floor(availableWidth * 0.018));
            const barWidth = Math.floor((availableWidth - (barGap * (BARS_COUNT - 1))) / BARS_COUNT);
            let x = paddingX;

            const maxHeight = canvas.height - 8;
            const nyquist = audioCtx.sampleRate / 2;

            const blockHeight = 4;
            const blockGap = 2;
            const maxSegments = Math.floor(maxHeight / (blockHeight + blockGap));

            for (let i = 0; i < BARS_COUNT; i++) {
                const [lowHz, highHz] = FREQ_BOUNDS[i];
                const lowIndex = Math.floor((lowHz / nyquist) * dataArray.length);
                const highIndex = Math.min(
                    Math.ceil((highHz / nyquist) * dataArray.length), 
                    dataArray.length - 1
                );

                let sum = 0;
                let count = 0;
                for (let j = lowIndex; j <= highIndex; j++) {
                    sum += dataArray[j];
                    count++;
                }
                const rawValue = count > 0 ? sum / count : 0;
                const highBoost = 1 + (i * 0.08);
                const targetHeight = (Math.min(255, rawValue * highBoost) / 255) * maxHeight;

                // Physics (Soft Drop)
                if (targetHeight > currentHeights[i]) {
                    currentHeights[i] = targetHeight;
                } else {
                    currentHeights[i] -= 2.0;
                    if (currentHeights[i] < 0) currentHeights[i] = 0;
                }

                if (currentHeights[i] > peakHeights[i]) {
                    peakHeights[i] = currentHeights[i];
                    peakHoldTimers[i] = 12;
                } else {
                    if (peakHoldTimers[i] > 0) {
                        peakHoldTimers[i]--;
                    } else {
                        peakHeights[i] -= 0.8;
                        if (peakHeights[i] < 0) peakHeights[i] = 0;
                    }
                }

                const activeSegments = Math.floor(currentHeights[i] / (blockHeight + blockGap));

                // 1. Unlit Ghost Segments
                ctx.fillStyle = 'rgba(84, 50, 70, 0.18)';
                for (let seg = 0; seg < maxSegments; seg++) {
                    const segY = canvas.height - 4 - (seg * (blockHeight + blockGap));
                    ctx.fillRect(x, segY, barWidth, blockHeight);
                }

                // 2. Active Illuminated VFD Segments
                for (let seg = 0; seg < activeSegments; seg++) {
                    const segY = canvas.height - 4 - (seg * (blockHeight + blockGap));
                    const ratio = seg / maxSegments;

                    if (ratio < 0.35) {
                        ctx.fillStyle = '#543246'; 
                        ctx.shadowColor = 'rgba(84, 50, 70, 0.3)';
                    } else if (ratio < 0.60) {
                        ctx.fillStyle = '#773a4d'; 
                        ctx.shadowColor = 'rgba(119, 58, 77, 0.4)';
                    } else if (ratio < 0.80) {
                        ctx.fillStyle = '#a75252'; 
                        ctx.shadowColor = 'rgba(167, 82, 82, 0.45)';
                    } else if (ratio < 0.92) {
                        ctx.fillStyle = '#cf7862'; 
                        ctx.shadowColor = 'rgba(207, 120, 98, 0.5)';
                    } else {
                        ctx.fillStyle = '#ee8695'; 
                        ctx.shadowColor = 'rgba(238, 134, 149, 0.6)';
                    }

                    ctx.shadowBlur = 3;
                    ctx.fillRect(x, segY, barWidth, blockHeight);
                }

                // 3. Floating Peak Cap
                if (peakHeights[i] > 2) {
                    const peakY = canvas.height - 4 - peakHeights[i];
                    ctx.fillStyle = '#ee8695';
                    ctx.shadowColor = '#ee8695';
                    ctx.shadowBlur = 4;
                    ctx.fillRect(x, peakY, barWidth, 2);
                }

                x += barWidth + barGap;
            }

            ctx.shadowBlur = 0;
        }
    </script>
</body>
</html>
